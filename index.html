				slideGroup.add(new THREE.Mesh(wGeo, wMat));
			}

			currentDist = segEnd;
		});
	}

    const bgPositions = [];
	const bgIndices = [];
	let bgIdxOffset = 0;

    const ledGeo = new THREE.SphereGeometry(0.012, 8, 8);
    const redMat = new THREE.MeshBasicMaterial({ color: 0xff0000 });
    const whiteMat = new THREE.MeshBasicMaterial({ color: 0xffffff });

    function createOrangeRing(dist, segIdx) {
				const pattern = [1, 2, 2, 1, 2, 2, 1, 2, 2, 1, 2, 2, 1]; 
				const halfW = 0.01; 
				const tMinus = mainPath.getTangentAt(dist/totalLen).clone().multiplyScalar(-halfW);
				const tPlus = mainPath.getTangentAt(dist/totalLen).clone().multiplyScalar(halfW);
				const G_rad = 0.02 / (getSlideProps(dist).diameter/2); 
				const S_rad = (Math.PI - 13 * G_rad) / 21; 

				let currAngle = 0;
				for (let half = 0; half < 2; half++) { 
					for (let i = 0; i < pattern.length; i++) {
						const segRad = pattern[i] * S_rad;
						const steps = pattern[i] === 1 ? 2 : 4; 
						for (let s = 0; s < steps; s++) {
							const a1 = currAngle + (s / steps) * segRad;
							const a2 = currAngle + ((s + 1) / steps) * segRad;
							const p1 = getPointOnSlide(dist, a1, 0.020, segIdx);
							const p2 = getPointOnSlide(dist, a2, 0.020, segIdx);
							const v1 = p1.clone().add(tMinus); const v2 = p2.clone().add(tMinus);
							const v3 = p1.clone().add(tPlus); const v4 = p2.clone().add(tPlus);
							bgPositions.push(v1.x, v1.y, v1.z, v2.x, v2.y, v2.z, v3.x, v3.y, v3.z, v4.x, v4.y, v4.z);
							bgIndices.push(bgIdxOffset, bgIdxOffset + 1, bgIdxOffset + 2, bgIdxOffset + 2, bgIdxOffset + 1, bgIdxOffset + 3);
							bgIdxOffset += 4;
						}
						currAngle += segRad + G_rad;
					}
				}
			}

	function placeRing(dist, segIdx) {
				if (dist > totalLen) return;
				const ledGroup = []; 
				createOrangeRing(dist, segIdx); 
				for (let i = 0; i < 40; i++) {
					if (i % 5 === 4) continue; 
					const a = (i / 40) * Math.PI * 2;
					const led = new THREE.Mesh(ledGeo, redMat);
					led.position.copy(getPointOnSlide(dist, a, 0.025, segIdx));
					if (segmentGroups[segIdx]) {
						segmentGroups[segIdx].add(led);
					} else {
						slideGroup.add(led);
					}
					ledGroup.push(led);
				}
				allRings.push(ledGroup);
			}
	function addDecorations() {
		let currentDist = 0;
		const worldUp = new THREE.Vector3(0, 1, 0);

		PARAMS.segments.forEach((seg, segIdx) => {
			// AUTOMATIKUS SZEKTOR-ÁTIRÁNYÍTÁS: Minden dekoráció a saját szektorába kerül!
			const _origAdd = slideGroup.add;
			slideGroup.add = function(...args) { segmentGroups[segIdx].add(...args); };

			const segLen = (seg.type === 'straight') ? (seg.len || 0.1) :
			               (seg.type === 'space_bowl') ? (
			                   (() => {
			                       const bowlD = parseFloat(seg.bowlDiameter) || 8.0;
			                       const rotations = parseFloat(seg.rotations) || 2.0;
			                       const R_tube = (seg.diameter || 2.0) / 2;
			                       const R_start = (bowlD / 2) - R_tube;
			                       const avgR = R_start / 2;
			                       const sweep = Math.PI * 1 * rotations;
			                       const spiralLen = avgR * sweep;
			                       const dropLen = 0.1;
			                       return spiralLen + dropLen;
			                   })()
			               ) :
			               ((parseFloat(seg.radius) || 0.1) * (Math.abs(parseFloat(seg.angle)) * Math.PI / 180));
			const segEnd = currentDist + segLen;

            window.SLIDE_RAD = (seg.diameter || 2.0) / 2;

			// Csak a tiszta nyitott és többpályás szakaszokat ugorjuk át teljesen
            if ((seg.shape === 'open' || seg.shape === 'multi') && seg.type !== 'space_bowl') {
                currentDist = segEnd;
                return;
            }

			if (seg.light === 'rings') {
				const segD = seg.diameter || 2.0;
				if (segD < 1.8) {
					// 1. ESET: Cső átmérő kisebb mint 1.8 m -> Eredeti gyűrűs logika
					for (let d = currentDist + 0.5; d < segEnd; d += OCTANT_LEN / 17) { 
						placeRing(d, segIdx);
					}
				} else {
					const R = segD / 2;
					const isStraightOrTightTurn = seg.type === 'straight' || (seg.type === 'turn' && (parseFloat(seg.radius) || 0) < 6.0);

					if (isStraightOrTightTurn) {
						// 2. ESET: Átmérő >= 1.8 m ÉS (Egyenes szakasz VAGY szűk kanyar R < 6 m)
						// Fele akkora gyűrű gyakoriság
						const stepDist = (OCTANT_LEN / 17) * 2;
						for (let d = currentDist + 0.5; d < segEnd; d += stepDist) {
							if (d > totalLen) continue;

							// Narancs szaggatott hordozószalag generálása (16 darabra bontva, 2 cm-es szünetekkel)
							const halfW = 0.01; // 2 cm vastag vonal -> 1 cm fél szélesség
							const tMinus = mainPath.getTangentAt(d / totalLen).clone().multiplyScalar(-halfW);
							const tPlus = mainPath.getTangentAt(d / totalLen).clone().multiplyScalar(halfW);
							
							const gapRad = 0.02 / R;
							const solidRad = (Math.PI * 2 - 16 * gapRad) / 16;
							
							let currAngle = 0;
							const ledGroup = [];

							for (let i = 0; i < 16; i++) {
								const steps = 6;
								for (let s = 0; s < steps; s++) {
									const a1 = currAngle + (s / steps) * solidRad;
									const a2 = currAngle + ((s + 1) / steps) * solidRad;
									
									const p1 = getPointOnSlide(d, a1, 0.020);
									const p2 = getPointOnSlide(d, a2, 0.020);
									
									const v1 = p1.clone().add(tMinus); const v2 = p2.clone().add(tMinus);
									const v3 = p1.clone().add(tPlus); const v4 = p2.clone().add(tPlus);
									
									bgPositions.push(v1.x, v1.y, v1.z, v2.x, v2.y, v2.z, v3.x, v3.y, v3.z, v4.x, v4.y, v4.z);
									bgIndices.push(bgIdxOffset, bgIdxOffset + 1, bgIdxOffset + 2, bgIdxOffset + 2, bgIdxOffset + 1, bgIdxOffset + 3);
									bgIdxOffset += 4;
								}

								// 96 LED elosztása (szakaszonként 6 LED)
								for (let l = 0; l < 6; l++) {
									const a = currAngle + ((l + 0.5) / 6) * solidRad;
									const led = new THREE.Mesh(ledGeo, redMat);
									led.position.copy(getPointOnSlide(d, a, 0.025));
									led.userData = { type: 'broken_ring' }; // <-- Címke a vízszintes animációhoz
									slideGroup.add(led);
									ledGroup.push(led);
								}
								currAngle += solidRad + gapRad;
							}
							allRings.push(ledGroup);
						}
					} else {
						// 3. ESET: Átmérő >= 1.8 m ÉS Tág kanyar R >= 6 m
						// Spirálvonal nyolcadkörönként hatszor körbehaladva a csövön, felfelé indulva
						const wraps = Math.max(1, Math.round((segLen / OCTANT_LEN) * 6));
						const startAngle = (seg.dir === 'left') ? 0 : Math.PI; // Nagyobb ív oldalának egyenlítője
						const rotSign = (seg.dir === 'left') ? 1 : -1; // Biztosítja, hogy mindkét irányban felfelé induljon

						for (let w = 0; w < wraps; w++) {
							const wStartD = currentDist + (w / wraps) * segLen;
							const wEndD = currentDist + ((w + 1) / wraps) * segLen;
							
							const C_wrap = Math.sqrt(Math.pow(segLen / wraps, 2) + Math.pow(Math.PI * 2 * R, 2));
							const gapT = 0.02 / C_wrap;
							const solidT = Math.max(0.01, (1.0 - 16 * gapT) / 16);

							const ledGroup = [];
							let currT = 0;

							for (let i = 0; i < 16; i++) {
								const steps = 6;
								for (let s = 0; s < steps; s++) {
									const t1 = currT + (s / steps) * solidT;
									const t2 = currT + ((s + 1) / steps) * solidT;

									const d1 = wStartD + t1 * (segLen / wraps);
									const d2 = wStartD + t2 * (segLen / wraps);
									const a1 = startAngle + rotSign * (w + t1) * Math.PI * 2;
									const a2 = startAngle + rotSign * (w + t2) * Math.PI * 2;

									const p1 = getPointOnSlide(d1, a1, 0.020);
									const p2 = getPointOnSlide(d2, a2, 0.020);

									const halfW = 0.01;
									const tMinus1 = mainPath.getTangentAt(d1 / totalLen).clone().multiplyScalar(-halfW);
									const tPlus1 = mainPath.getTangentAt(d1 / totalLen).clone().multiplyScalar(halfW);
									const tMinus2 = mainPath.getTangentAt(d2 / totalLen).clone().multiplyScalar(-halfW);
									const tPlus2 = mainPath.getTangentAt(d2 / totalLen).clone().multiplyScalar(halfW);

									const v1 = p1.clone().add(tMinus1); const v2 = p2.clone().add(tMinus2);
									const v3 = p1.clone().add(tPlus1); const v4 = p2.clone().add(tPlus2);

									bgPositions.push(v1.x, v1.y, v1.z, v2.x, v2.y, v2.z, v3.x, v3.y, v3.z, v4.x, v4.y, v4.z);
									bgIndices.push(bgIdxOffset, bgIdxOffset + 1, bgIdxOffset + 2, bgIdxOffset + 2, bgIdxOffset + 1, bgIdxOffset + 3);
									bgIdxOffset += 4;
								}

								// 96 LED elhelyezése spirál-menetenként (szakaszonként 6 LED)
								for (let l = 0; l < 6; l++) {
									const t_led = currT + ((l + 0.5) / 6) * solidT;
									const d_led = wStartD + t_led * (segLen / wraps);
									const a_led = startAngle + rotSign * (w + t_led) * Math.PI * 2;

									const led = new THREE.Mesh(ledGeo, redMat);
									led.position.copy(getPointOnSlide(d_led, a_led, 0.025));
									led.userData = { type: 'spiral', wrapIdx: w }; // <-- Címke a körbemenős animációhoz
									slideGroup.add(led);
									ledGroup.push(led);
								}
								currT += solidT + gapT;
							}
							allRings.push(ledGroup);
						}
					}
				}
			}
			
			else if (seg.light === 'star_rings' && (seg.diameter || 2.0) >= 1.4) {
				const D = seg.diameter || 2.0;
				const R = D / 2;

				if (D >= 2.5) {
					// --- JELENLEGI LOGIKA (Átmérő >= 2.5 m esetén változatlanul hagyva) ---
					const ringWidth = 0.08 * D;
					const distStep = 0.90 * D;
					const u2t = (deg) => (deg * Math.PI / 180) - Math.PI / 2;
					const gapRad = 0.16; 
					const gapDeg = gapRad * (180 / Math.PI);
					const hGap = gapDeg / 2;

					const arc1Start = u2t(30);
					const arc1End   = u2t(150 - hGap);
					const arc2Start = u2t(150 + hGap);
					const arc2End   = u2t(210 - hGap);
					const arc3Start = u2t(210 + hGap);
					const arc3End   = u2t(330);

					const circleR = (0.32 * D) / 2;
					const starOuterR = (0.20 * D) / 2;
					const starInnerR = starOuterR * 0.4; 

					function createCircleWithStarHole(pointsCount) {
						const shape = new THREE.Shape();
						shape.absarc(0, 0, circleR, 0, Math.PI * 2, false);
						const holePath = new THREE.Path();
						for (let i = pointsCount * 2; i >= 0; i--) {
							const r = (i % 2 === 0) ? starOuterR : starInnerR;
							const a = (i / (pointsCount * 2)) * Math.PI * 2 + Math.PI / 2;
							if (i === pointsCount * 2) holePath.moveTo(Math.cos(a) * r, Math.sin(a) * r);
							else holePath.lineTo(Math.cos(a) * r, Math.sin(a) * r);
						}
						shape.holes.push(holePath);
						return new THREE.ShapeGeometry(shape);
					}

					const shape5Geo = createCircleWithStarHole(5);
					const shape7Geo = createCircleWithStarHole(7);

					function createThickBand(d, sA, eA) {
						const steps = Math.max(1, Math.ceil(Math.abs(eA - sA) / (Math.PI / 16)));
						const verts = [], indices = [];
						for(let i=0; i<=steps; i++) {
							const ang = sA + (i/steps)*(eA - sA);
							const pCenter = getPointOnSlide(d, ang, 0.020);
							const tVal = Math.min(1, Math.max(0, d / totalLen));
							const T = mainPath.getTangentAt(tVal).normalize();
							
							const p1 = pCenter.clone().add(T.clone().multiplyScalar(-ringWidth/2));
							const p2 = pCenter.clone().add(T.clone().multiplyScalar(ringWidth/2));
							
							verts.push(p1.x, p1.y, p1.z, p2.x, p2.y, p2.z);
							if (i > 0) {
								const b = (i - 1) * 2;
								indices.push(b, b+1, b+2, b+1, b+3, b+2);
							}
						}
						const geo = new THREE.BufferGeometry();
						geo.setAttribute('position', new THREE.Float32BufferAttribute(verts, 3));
						geo.setIndex(indices);
						geo.computeVertexNormals();
						slideGroup.add(new THREE.Mesh(geo, orangeMat));

						const ledSteps = Math.ceil(Math.abs(eA - sA) / 0.15);
						for(let i=0; i<=ledSteps; i++) {
							const ang = sA + (i/ledSteps)*(eA - sA);
							const lp = getPointOnSlide(d, ang, 0.025);
							const led = new THREE.Mesh(new THREE.SphereGeometry(0.015, 8, 8), redMat);
							led.position.copy(lp);
							led.userData = { angle: ang, dist: d };
							starRingLeds.push(led);
							slideGroup.add(led);
						}
					}

					function placeStarDecal(d, ang, shapeGeo, pts) {
						const bentGeo = bendGeometryToSlide(shapeGeo, d, ang, 0.022);
						slideGroup.add(new THREE.Mesh(bentGeo, faintOrangeMat)); 

						const ledGeoLoc = new THREE.SphereGeometry(0.010, 8, 8); 
						const t_val = Math.max(0, Math.min(1, d / totalLen));
						const pos = mainPath.getPointAt(t_val);
						const T = mainPath.getTangentAt(t_val).normalize();
						const worldUp = new THREE.Vector3(0, 1, 0);
						let B = new THREE.Vector3().crossVectors(T, worldUp).normalize();
						if (B.lengthSq() < 0.0001) {
							const altUp = new THREE.Vector3(0, 0, 1);
							B = new THREE.Vector3().crossVectors(T, altUp).normalize();
						}
						const N = new THREE.Vector3().crossVectors(B, T).normalize();
						const ledOffsetR = R - 0.025; 

						function getPerfectLocalPoint(lx, ly) {
							const ledAng = ang - (ly / R);
							const ox = Math.cos(ledAng) * ledOffsetR;
							const oy = Math.sin(ledAng) * ledOffsetR;
							return pos.clone()
								.add(B.clone().multiplyScalar(ox))
								.add(N.clone().multiplyScalar(oy))
								.add(T.clone().multiplyScalar(lx));
						}

						const cLed = new THREE.Mesh(ledGeoLoc, redMat);
						cLed.position.copy(getPerfectLocalPoint(0, 0));
						slideGroup.add(cLed);

						const numVertices = pts * 2;
						const vertices = [];
						for (let i = 0; i < numVertices; i++) {
							const r = (i % 2 === 0) ? starOuterR : starInnerR;
							const a = (i / numVertices) * Math.PI * 2 + Math.PI / 2;
							vertices.push({ x: Math.cos(a) * r, y: Math.sin(a) * r });
						}
						vertices.push(vertices[0]); 

						const ledSpacing = 0.025; 
						for (let i = 0; i < numVertices; i++) {
							const v1 = vertices[i];
							const v2 = vertices[i + 1];
							const dx = v2.x - v1.x;
							const dy = v2.y - v1.y;
							const edgeLen = Math.hypot(dx, dy);
							const steps = Math.max(2, Math.round(edgeLen / ledSpacing));

							for (let s = 0; s < steps; s++) { 
								const t_edge = s / steps;
								const lx = v1.x + dx * t_edge;
								const ly = v1.y + dy * t_edge;

								const led = new THREE.Mesh(ledGeoLoc, redMat);
								led.position.copy(getPerfectLocalPoint(lx, ly));
								slideGroup.add(led);
							}
						}
					}

					for (let d = currentDist + distStep / 2; d < segEnd; d += distStep) {
						createThickBand(d, arc1Start, arc1End);
						createThickBand(d, arc2Start, arc2End);
						createThickBand(d, arc3Start, arc3End);

						const dHalf = d + distStep / 2;
						if (dHalf < segEnd) {
							placeStarDecal(dHalf, u2t(90), shape5Geo, 5);
							placeStarDecal(dHalf, u2t(180), shape7Geo, 7);
							placeStarDecal(dHalf, u2t(270), shape5Geo, 5);
						}
					}
				} else {
					// --- ÚJ LOGIKA (Átmérő < 2.5 m esetén) ---
					// Kijelzők mérete: 35 cm (sugár: 17.5 cm / 0.175 m)
					// Gyűrűk távolsága egymástól: 70 cm (0.70 m)
					const distStep = 0.70; 

					// Öt- és hétágú csillagos kijelzők létrehozása 35 cm-es átmérővel
					const createCustomStarDisplay = (dDisp, angle, numPoints, rotateTex = false) => {
						const bgRadius = 0.175 * (0.35 / 0.335); // Arányos hordozókorong
						const bgGeo = bendGeometryToSlide(new THREE.CircleGeometry(bgRadius, 32), dDisp, angle, 0.030);
						const bgMesh = new THREE.Mesh(bgGeo, faintOrangeMat);
						slideGroup.add(bgMesh);

						const pType = (numPoints === 7) ? 'star7' : 'star';
						const canvas = document.createElement('canvas');
						canvas.width = 512; canvas.height = 512;
						const ctx = canvas.getContext('2d');
						const texture = new THREE.CanvasTexture(canvas);
						
						if (rotateTex) {
							texture.center.set(0.5, 0.5);
							texture.rotation = Math.PI / 7; // 1/14-ed környi elforgatás
						}

						const mat = new THREE.MeshBasicMaterial({ map: texture, transparent: true, side: THREE.DoubleSide });

						const dotCanvas = document.createElement('canvas');
						dotCanvas.width = 32; dotCanvas.height = 32; 
						const dCtx = dotCanvas.getContext('2d');
						dCtx.shadowBlur = window.LED_RADIUS * 3; 
						dCtx.shadowColor = '#ff0000';
						dCtx.fillStyle = '#ff0000';
						dCtx.beginPath(); dCtx.arc(16, 16, window.LED_RADIUS, 0, Math.PI * 2); dCtx.fill();
						dCtx.shadowBlur = 0;
						dCtx.fillStyle = '#ff1a00'; // Élénkvörös belső mag
						dCtx.beginPath(); dCtx.arc(16, 16, window.LED_RADIUS * 0.6, 0, Math.PI * 2); dCtx.fill();

						const displayData = {
							canvas: canvas, ctx: ctx, texture: texture, material: mat,
							patternType: pType, color: '#ff0000', physicalPos: 'ceiling', 
							starType: 'large', isDouble: false, id: Math.floor(dDisp),
							lastCoilStep: -1, lastStarStep: -1,
							dotCanvas: dotCanvas,
							// Egyedi kód beolvasása és állapot-cache inicializálása
							customCode: (() => {
								try {
									return seg.ledCustomCode ? JSON.parse(seg.ledCustomCode) : null;
								} catch (e) {
									console.warn("Érvénytelen LED kód:", e);
									return null;
								}
							})(),
							customFrameIdx: 0,
							customLastUpdate: 0,
							customGridState: null
						};

						activeSharedLeds.push(displayData);

						const displayGeo = new THREE.CircleGeometry(0.175, 32); // 17.5 cm sugár = 35 cm átmérő
						const geo = bendGeometryToSlide(displayGeo, dDisp, angle, 0.040);
						const mesh = new THREE.Mesh(geo, mat);
						displayData.mesh = mesh;
						slideGroup.add(mesh);
					};

					for (let d = currentDist + distStep / 2; d < segEnd; d += distStep) {
						// 16 egyenlő szegmensre szaggatott gyűrűk generálása, 64 LED (szegmensenként 4 LED)
						const gapRad = 0.02 / R;
						const solidRad = (Math.PI * 2 - 16 * gapRad) / 16;
						let currAngle = 0;
						const ledGroup = [];

						const halfW = 0.01;
						const tMinus = mainPath.getTangentAt(d / totalLen).clone().multiplyScalar(-halfW);
						const tPlus = mainPath.getTangentAt(d / totalLen).clone().multiplyScalar(halfW);

						for (let i = 0; i < 16; i++) {
							const steps = 6;
							for (let s = 0; s < steps; s++) {
								const a1 = currAngle + (s / steps) * solidRad;
								const a2 = currAngle + ((s + 1) / steps) * solidRad;
								
								const p1 = getPointOnSlide(d, a1, 0.020);
								const p2 = getPointOnSlide(d, a2, 0.020);
								
								const v1 = p1.clone().add(tMinus); const v2 = p2.clone().add(tMinus);
								const v3 = p1.clone().add(tPlus); const v4 = p2.clone().add(tPlus);
								
								bgPositions.push(v1.x, v1.y, v1.z, v2.x, v2.y, v2.z, v3.x, v3.y, v3.z, v4.x, v4.y, v4.z);
								bgIndices.push(bgIdxOffset, bgIdxOffset + 1, bgIdxOffset + 2, bgIdxOffset + 2, bgIdxOffset + 1, bgIdxOffset + 3);
								bgIdxOffset += 4;
							}

							for (let l = 0; l < 4; l++) {
								const a = currAngle + ((l + 0.5) / 4) * solidRad;
								const led = new THREE.Mesh(ledGeo, redMat);
								led.position.copy(getPointOnSlide(d, a, 0.025));
								led.userData = { type: 'star_ring_64' }; // <-- 64-es gyűrűs mintakövetés
								slideGroup.add(led);
								ledGroup.push(led);
							}
							currAngle += solidRad + gapRad;
						}
						allRings.push(ledGroup);

						// LED kijelzők elhelyezése a gyűrűk között féltávnál
						const dHalf = d + distStep / 2;
						if (dHalf < segEnd) {
							// Oldalak: 5 ágú csillagok (35 cm-es átmérővel)
							createCustomStarDisplay(dHalf, 0, 5, false);
							createCustomStarDisplay(dHalf, Math.PI, 5, false);
							// Plafon: 7 ágú csillag (35 cm-es átmérővel), 1/14-ed fordulat eltolással
							createCustomStarDisplay(dHalf, Math.PI / 2, 7, true);
						}
					}
				}
			}
			else if (seg.light === 'stars') {
				const cellLength = 0.2; 
				const angleSpan = Math.PI; 
				
				const starsPerRing = Math.floor((angleSpan * window.SLIDE_RAD) / cellLength); 
				const angleStep = angleSpan / starsPerRing;
				const jitterAmount = 0.8;

				for (let d = currentDist; d < segEnd; d += cellLength) {
					for (let i = 0; i < starsPerRing; i++) {
						const dOffset = (Math.random() - 0.5) * cellLength * jitterAmount;
						const aOffset = (Math.random() - 0.5) * angleStep * jitterAmount;

						const finalD = Math.max(currentDist, Math.min(segEnd, d + dOffset));
						const finalAng = i * angleStep + aOffset;

						// 3D ívre hajlított narancssárga háttér négyzet
						const bentSquareGeo = bendGeometryToSlide(squareGeoPre, finalD, finalAng, 0.022);
						const square = new THREE.Mesh(bentSquareGeo, orangeMat);
						slideGroup.add(square);

						// 3D ívre hajlított belső piros LED pötty
						const bentDotGeo = bendGeometryToSlide(dotGeoPre, finalD, finalAng, 0.025);
						const redDot = new THREE.Mesh(bentDotGeo, redMatDot);
						redDot.userData = { rnd: Math.random() * 25 };
						starPoints.push(redDot); 
						slideGroup.add(redDot);
					}
				}
			}

			else if (seg.light === 'dots') {
				for (let d = currentDist + 0.5; d < segEnd; d += 1.0) {
					const centerPos = mainPath.getPointAt(d / totalLen);
					const finalPos = getPointOnSlide(d, Math.PI / 2, 0.022); 

					const bgDot = new THREE.Mesh(new THREE.CircleGeometry(0.06, 16), orangeMat);
					bgDot.position.copy(finalPos); 
					bgDot.lookAt(centerPos); 
					slideGroup.add(bgDot);

					const whiteDot = new THREE.Mesh(new THREE.CircleGeometry(0.04, 16), whiteMatPure);
					whiteDot.position.copy(getPointOnSlide(d, Math.PI / 2, 0.025)); 
					whiteDot.lookAt(centerPos);
					slideGroup.add(whiteDot);
					whiteDotsGroup.add(whiteDot);
				}
			}
			else if (seg.light === 'floor_run') {
				for (let d = currentDist + 1.0; d < segEnd; d += 0.8) {
					const centerPos = mainPath.getPointAt(d / totalLen);
					const T = mainPath.getTangentAt(d / totalLen).normalize();
					const finalPos = getPointOnSlide(d, -Math.PI / 2, 0.020); 

					const bgMesh = new THREE.Mesh(new THREE.PlaneGeometry(0.25, 0.6), orangeMat);
					bgMesh.position.copy(finalPos); 
					bgMesh.up.copy(T); 
					bgMesh.lookAt(centerPos); 
					slideGroup.add(bgMesh);

					const fgMesh = new THREE.Mesh(new THREE.PlaneGeometry(0.18, 0.5), whiteMatPure);
					fgMesh.position.copy(getPointOnSlide(d, -Math.PI / 2, 0.023)); 
					fgMesh.up.copy(T); 
					fgMesh.lookAt(centerPos);
					fgMesh.userData = { dist: d }; 
					floorLights.push(fgMesh); 
					slideGroup.add(fgMesh);
				}
			}
			else if (seg.light === 'center_tris') {
				const centerDist = currentDist + (segLen / 2);
				const t = centerDist / totalLen;
				const pos = mainPath.getPointAt(t);
				const T = mainPath.getTangentAt(t).normalize();
				const B = new THREE.Vector3().crossVectors(T, worldUp).normalize();
				const N = new THREE.Vector3().crossVectors(B, T).normalize();

				for (let i = 0; i < 10; i++) {
					const ang = (i / 10) * Math.PI * 2;
					
					
					const off = getPointOnSlide(centerDist, ang, 0.035).sub(pos);
					
					for (let dir = -1; dir <= 1; dir += 2) {
						const posOffset = pos.clone().add(T.clone().multiplyScalar(dir * 0.01));
						const bgMesh = new THREE.Mesh(triGeoOuterPre, orangeMat);
						bgMesh.position.copy(posOffset).add(off); bgMesh.up.copy(dir === 1 ? T : T.clone().negate()); bgMesh.lookAt(posOffset); slideGroup.add(bgMesh);
						
						const fgMesh = new THREE.Mesh(triGeoInnerPre, whiteMatPure);
						fgMesh.position.copy(posOffset).add(off.clone().multiplyScalar(0.99)); 
						fgMesh.up.copy(dir === 1 ? T : T.clone().negate()); fgMesh.lookAt(posOffset);
						fgMesh.translateY(0.04); fgMesh.userData = { index: i }; 
						centerTriangles.push(fgMesh); slideGroup.add(fgMesh);
					}
				}
			}
			else if (seg.light === 'stars2') {
				const scale = seg.starsScale !== undefined ? seg.starsScale : 1.0;
				
				const S = 0.22 * scale; 
				const distStep = S * Math.sqrt(3) / 2; 
				
				const scaledOuterGeo = starGeoOuterPre.clone().scale(scale, scale, 1);
				const scaledInnerGeo = starGeoInnerPre.clone().scale(scale, scale, 1);
				
				const props = getSlideProps(currentDist);
				const R = props.diameter / 2;

				// JAVÍTÁS: Lusta folyónál a csillagok sűrűségének megtartásához a valódi 3.0m-es sugarat használjuk lépésközként
				const R_for_step = (seg.shape === 'lazy') ? 3.0 : R;
				const angStep = S / R_for_step; 
				
				const angStart = 0.08;
				const angEnd = Math.PI - 0.08;

				let rowCount = 0;
				for (let d = currentDist + distStep / 2; d < segEnd; d += distStep) {
					const staggerOffset = (rowCount % 2 === 0) ? 0 : (angStep * 0.5);
					
					for (let a = angStart + staggerOffset; a <= angEnd; a += angStep) {
						const ang = a;
						
						// 3D ívre hajlított külső narancs csillag keret
						const bentOuterGeo = bendGeometryToSlide(scaledOuterGeo, d, ang, 0.020);
						const bgStar = new THREE.Mesh(bentOuterGeo, orangeMat);
						slideGroup.add(bgStar);

						// 3D ívre hajlított belső világító színes csillag
						const bentInnerGeo = bendGeometryToSlide(scaledInnerGeo, d, ang, 0.025);
						const innerStar = new THREE.Mesh(bentInnerGeo, new THREE.MeshBasicMaterial({ color: 0xffffff, side: THREE.DoubleSide }));
						innerStar.userData = { phase: Math.random() * 10, posIndex: rowCount };
						star2Points.push(innerStar); 
						slideGroup.add(innerStar);
					}
					rowCount++;
				}
			}
			else if (seg.light === 'center_tris' && seg.type === 'straight') {
				const centerDist = currentDist + (segLen / 2);
				const t = centerDist / totalLen;
				const pos = mainPath.getPointAt(t);
				const T = mainPath.getTangentAt(t).normalize();
				const B = new THREE.Vector3().crossVectors(T, worldUp).normalize();
				const N = new THREE.Vector3().crossVectors(B, T).normalize();

				for (let i = 0; i < 10; i++) {
					const ang = (i / 10) * Math.PI * 2;
					
					
					const off = getPointOnSlide(centerDist, ang, 0.035).sub(pos);
					
					for (let dir = -1; dir <= 1; dir += 2) {
						const posOffset = pos.clone().add(T.clone().multiplyScalar(dir * 0.01));
						const bgMesh = new THREE.Mesh(triGeoOuterPre, orangeMat);
						bgMesh.position.copy(posOffset).add(off); bgMesh.up.copy(dir === 1 ? T : T.clone().negate()); bgMesh.lookAt(posOffset); slideGroup.add(bgMesh);
						
						const fgMesh = new THREE.Mesh(triGeoInnerPre, whiteMatPure);
						fgMesh.position.copy(posOffset).add(off.clone().multiplyScalar(0.99)); 
						fgMesh.up.copy(dir === 1 ? T : T.clone().negate()); fgMesh.lookAt(posOffset);
						fgMesh.translateY(0.04); fgMesh.userData = { index: i }; 
						centerTriangles.push(fgMesh); slideGroup.add(fgMesh);
					}
				}
			}
			else if ((seg.light === 'turn_circles' || seg.light === 'turn_droplets') && seg.type === 'turn') {
				const isDrop = (seg.light === 'turn_droplets');
				const angleStep = Math.PI / 6; 
				const totalTurnRad = (seg.angle * Math.PI) / 180;
				const angleBuffer = 0.4 / seg.radius;
				
				// 1.5-szeresére megnövelt alap 2D vízcsepp alakzat (Shape)
				const dropletShape = new THREE.Shape();
				dropletShape.moveTo(0, 0.30); // 0.20 helyett 0.30-as magasság
				dropletShape.bezierCurveTo(0.15, 0.15, 0.15, -0.15, 0, -0.15); // 0.10 helyett 0.15-ös szélesség
				dropletShape.bezierCurveTo(-0.15, -0.15, -0.15, 0.15, 0, 0.30);
				const dropletGeoBase = new THREE.ShapeGeometry(dropletShape);

				for (let a = angleStep; a <= totalTurnRad - angleBuffer; a += angleStep) {
					const d = currentDist + (a * seg.radius);
					const sides = [Math.PI / 4, 3 * Math.PI / 4];
					
					sides.forEach(sideCenterAngle => {
						if (isDrop) {
							const isLeft = (sideCenterAngle === 3 * Math.PI / 4);
							const flipSign = isLeft ? -1 : 1;

							const targetGeo = isLeft ? dropletGeoBase.clone().scale(-1, 1, 1) : dropletGeoBase;

							// 1. NAGYOBB SZILÁRD NARANCS VÍZCSEPP
							const bentDropletGeo = bendGeometryToSlide(targetGeo, d, sideCenterAngle, 0.020);
							const dropletMesh = new THREE.Mesh(bentDropletGeo, orangeMat);
							dropletMesh.castShadow = true;
							slideGroup.add(dropletMesh);

							// 2. BELEÁGYAZOTT FEHÉR LED PONTOK (Skálázott és tükrözött elrendezésben)
							const ledYPositions = [-0.07 * flipSign, 0.04 * flipSign, 0.16 * flipSign];
							ledYPositions.forEach(localLy => {
								const ledPos = getPointOnSlide(d, sideCenterAngle + (localLy / window.SLIDE_RAD), 0.025);
								const led = new THREE.Mesh(new THREE.SphereGeometry(0.015, 8, 8), whiteMat);
								led.position.copy(ledPos);
								
								turnLeds.push(led); 
								slideGroup.add(led);
							});
						} else {
							// Klasszikus kanyari körök
							const ringPoints = [];
							const radius = 0.375;
							for (let i = 0; i <= 32; i++) {
								const theta = (i / 32) * Math.PI * 2;
								const lx = Math.cos(theta) * radius;
								const ly = Math.sin(theta) * radius;
								ringPoints.push(getPointOnSlide(d + lx, sideCenterAngle + (ly / window.SLIDE_RAD), 0.01));
							}
							const ringCurve = new THREE.CatmullRomCurve3(ringPoints);
							slideGroup.add(new THREE.Mesh(new THREE.TubeGeometry(ringCurve, 40, 0.015, 8, true), orangeBaseMat));

							for (let i = 0; i < 8; i++) {
								const theta = (i / 8) * Math.PI * 2;
								const lp = getPointOnSlide(d + Math.cos(theta)*radius, sideCenterAngle + (Math.sin(theta)*radius/window.SLIDE_RAD), 0.02);
								const l = new THREE.Mesh(new THREE.SphereGeometry(0.018, 8, 8), whiteMat);
								l.position.copy(lp);
								turnLeds.push(l); slideGroup.add(l);
							}
						}
					});
				}
			}
			else if (seg.light === 'zigzag') {
				// 1. LAPOS 2D CIKKCAKK SZALAG (Szalag szélessége: 8 cm, pontosan rásimul a cső belső héjára)
				const step = 0.04; // Sűrű mintavételezés a tökéletesen sima kanyarokért
				const ribbonWidth = 0.08; 
				const halfWidthAng = (ribbonWidth / 2) / window.SLIDE_RAD;

				const verts = [];
				const indices = [];
				let vertIdx = 0;

				for (let d = currentDist; d <= segEnd; d += step) {
					// Szinuszos cikkcakk hullám középvonala
					const centerAngle = (Math.PI / 2) + Math.sin(d * 6) * 0.22;
					const leftAng = centerAngle - halfWidthAng;
					const rightAng = centerAngle + halfWidthAng;

					// Pontok kiszámítása pontosan a cső falának belső ívén (0.020 m mélységben)
					const pL = getPointOnSlide(d, leftAng, 0.020);
					const pR = getPointOnSlide(d, rightAng, 0.020);

					verts.push(pL.x, pL.y, pL.z);
					verts.push(pR.x, pR.y, pR.z);

					if (d > currentDist) {
						// Négyszög képzése két háromszögből
						const a = vertIdx - 2;
						const b = vertIdx - 1;
						const c = vertIdx;
						const d_idx = vertIdx + 1;

						indices.push(a, b, c);
						indices.push(b, d_idx, c);
					}
					vertIdx += 2;
				}

				const ribbonGeo = new THREE.BufferGeometry();
				ribbonGeo.setAttribute('position', new THREE.Float32BufferAttribute(verts, 3));
				ribbonGeo.setIndex(indices);
				ribbonGeo.computeVertexNormals();

				const ribbonMesh = new THREE.Mesh(ribbonGeo, orangeBaseMat);
				ribbonMesh.castShadow = true;
				slideGroup.add(ribbonMesh);

				// 2. BEÁGYAZOTT FEHÉR LED PONTOK (A cikkcakk középvonalán futó pontok)
				for (let d = currentDist + 0.1; d < segEnd; d += 0.2) {
					const centerAngle = (Math.PI / 2) + Math.sin(d * 6) * 0.22;
					// 5 mm-rel a szalag fölé emelve a tökéletes láthatóságért (Z-fighting ellen)
					const ledPos = getPointOnSlide(d, centerAngle, 0.025); 

					const led = new THREE.Mesh(new THREE.SphereGeometry(0.015, 8, 8), whiteMat);
					led.position.copy(ledPos);
					
					zigzagLeds.push(led); 
					slideGroup.add(led);
				}
			}
			else if (seg.light === 'text' && seg.type === 'straight') {
				const textVal = seg.textValue || 'BLACK HOLE';
				
				// 1. KÜLSŐ TEXTÚRA (Függőlegesen tükrözve, hogy kívülről szabályosan álljon)
				const canvasOut = document.createElement('canvas');
				canvasOut.width = 1024; canvasOut.height = 256;
				const ctxOut = canvasOut.getContext('2d');
				ctxOut.clearRect(0, 0, 1024, 256);
				ctxOut.save();
				ctxOut.translate(0, 256);
				ctxOut.scale(1, -1); // Vertikális tükrözés
				ctxOut.fillStyle = '#ff7700';
				ctxOut.font = 'bold 110px Arial';
				ctxOut.textAlign = 'center'; ctxOut.textBaseline = 'middle';
				ctxOut.fillText(textVal, 512, 128);
				ctxOut.restore();
				
				const texOut = new THREE.CanvasTexture(canvasOut);
				texOut.colorSpace = THREE.SRGBColorSpace;
				
				// 2. BELSŐ TEXTÚRA (A külsővel megegyező állású és irányú a belső olvashatóságért)
				const canvasIn = document.createElement('canvas');
				canvasIn.width = 1024; canvasIn.height = 256;
				const ctxIn = canvasIn.getContext('2d');
				ctxIn.clearRect(0, 0, 1024, 256);
				ctxIn.save();
				ctxIn.translate(0, 256);
				ctxIn.scale(1, -1); // Vertikális tükrözés (megegyezik a külsővel)
				ctxIn.fillStyle = '#ff7700';
				ctxIn.font = 'bold 110px Arial';
				ctxIn.textAlign = 'center'; ctxIn.textBaseline = 'middle';
				ctxIn.fillText(textVal, 512, 128);
				ctxIn.restore();
				
				const texIn = new THREE.CanvasTexture(canvasIn);
				texIn.colorSpace = THREE.SRGBColorSpace;

				const R = window.SLIDE_RAD;
				
				// Sík geometria (szélesség = csúszda hossza, magasság = cső ívhossza)
				const textGeoBase = new THREE.PlaneGeometry(seg.len * 0.7, R * 1.0, 32, 16);
				const dCenter = currentDist + segLen / 2;

				const textMatOut = new THREE.MeshBasicMaterial({ map: texOut, transparent: true, side: THREE.DoubleSide });
				const textMatIn = new THREE.MeshBasicMaterial({ map: texIn, transparent: true, side: THREE.DoubleSide });

				// 45 fokos szög a jobb oldal (0 radián) és a mennyezet (Math.PI/2 radián) között
				const targetAngle = Math.PI / 4;

				// Külső felirat: 1.5 cm-rel a cső külső fala felett (-0.015 m offset)
				const bentGeoOut = bendGeometryToSlide(textGeoBase, dCenter, targetAngle, -0.015);
				const meshOut = new THREE.Mesh(bentGeoOut, textMatOut);

				// Belső felirat: 1.5 cm-rel a cső belső fala alatt (0.015 m offset)
				const bentGeoIn = bendGeometryToSlide(textGeoBase, dCenter, targetAngle, 0.015);
				const meshIn = new THREE.Mesh(bentGeoIn, textMatIn);

				slideGroup.add(meshOut, meshIn);
			}
			else if (seg.light === 'led_displays') {
				let leftCount = 0;
				let rightCount = 0;
				const createLEDDisplayAt = (d, finalAng, id, customRadius = 0.335, finalColor = '#ff0000') => {

					const bgRadius = customRadius * (0.35 / 0.335);
					const bgGeo = bendGeometryToSlide(new THREE.CircleGeometry(bgRadius, 32), d, finalAng, 0.030);
					const bgMesh = new THREE.Mesh(bgGeo, faintOrangeMat);
					slideGroup.add(bgMesh);

					let pType = seg.ledPattern || 'all';
					if (pType === 'all') {
						pType = (id % 3 === 0) ? 'smiley' : ((id % 3 === 1) ? 'coil' : 'star');
					}

					let normAng = finalAng % (Math.PI * 2);
					if (normAng < 0) normAng += Math.PI * 2;
					
					let physicalPos = 'ceiling';
					if (Math.abs(normAng - Math.PI/2) < 0.2) physicalPos = 'ceiling';
					else if (normAng < Math.PI/2 || normAng > 1.5 * Math.PI) physicalPos = 'right';
					else physicalPos = 'left';

					let sideIndex = 0;
					if (physicalPos === 'left') sideIndex = leftCount++;
					if (physicalPos === 'right') sideIndex = rightCount++;

					// 3. CSILLAG MÉRETÉNEK KISZÁMÍTÁSA
					let starType = 'large';
					if (physicalPos !== 'ceiling') {
						let isOuter = true; 
						if (seg.type === 'turn') {
							if (seg.dir === 'left' && physicalPos === 'left') isOuter = false; 
							if (seg.dir === 'right' && physicalPos === 'right') isOuter = false; 
						}
						let limit = isOuter ? 3 : 2;
						if (sideIndex < limit) starType = 'small';
					}

					// ÚJ: Megnézzük, hogy ez a plafonon lévő DUPLA kijelző-e (0.5 méternél nagyobb sugár)
					const isDouble = customRadius > 0.5;

					// A cache kulcsába belevesszük az isDouble jelzőt is
					const cacheKey = pType + "_" + finalColor + "_" + physicalPos + "_" + starType + "_" + isDouble + "_" + id;
					let mat;

					if (sharedLedMaterials[cacheKey]) {
						mat = sharedLedMaterials[cacheKey].material;
					} else {
						const canvas = document.createElement('canvas');
						canvas.width = 512; canvas.height = 512;
						const ctx = canvas.getContext('2d');
						const texture = new THREE.CanvasTexture(canvas);
						mat = new THREE.MeshBasicMaterial({ map: texture, transparent: true, side: THREE.DoubleSide });
						
						const dotCanvas = document.createElement('canvas');
						dotCanvas.width = 32; dotCanvas.height = 32; 
						const dCtx = dotCanvas.getContext('2d');
						
						dCtx.shadowBlur = window.LED_RADIUS * 3; 
						dCtx.shadowColor = finalColor;
						dCtx.fillStyle = finalColor;
						dCtx.beginPath(); dCtx.arc(16, 16, window.LED_RADIUS, 0, Math.PI * 2); dCtx.fill();
						
						dCtx.shadowBlur = 0;
						dCtx.fillStyle = '#ff1a00'; // Élénkvörös 660 nm-es tiszta LED szín
						dCtx.beginPath(); dCtx.arc(16, 16, window.LED_RADIUS * 0.6, 0, Math.PI * 2); dCtx.fill();
						
						const displayData = {
							canvas: canvas, ctx: ctx, texture: texture, material: mat,
							patternType: pType, color: finalColor, physicalPos: physicalPos, 
							starType: starType, isDouble: isDouble, id: id,
							lastCoilStep: -1, lastStarStep: -1,
							dotCanvas: dotCanvas,
							// Egyedi kód beolvasása és állapot-cache inicializálása
							customCode: (() => {
								try {
									return seg.ledCustomCode ? JSON.parse(seg.ledCustomCode) : null;
								} catch (e) {
									console.warn("Érvénytelen LED kód:", e);
									return null;
								}
							})(),
							customFrameIdx: 0,
							customLastUpdate: 0,
							customGridState: null
						};
						
						sharedLedMaterials[cacheKey] = displayData;
						activeSharedLeds.push(displayData);
					}
					
					const displayGeo = new THREE.CircleGeometry(customRadius, 32);
					const geo = bendGeometryToSlide(displayGeo, d, finalAng, 0.040);
					const mesh = new THREE.Mesh(geo, mat);
					slideGroup.add(mesh);
				};

				const layout = seg.ledLayout || 'classic';
				const colorOpt = seg.ledColor || '#ff0000';
				
				const getAngle = (baseAngle) => {
					if (!seg.flipLedLayout) return baseAngle;
					// Tükrözés a függőleges tengelyre (Math.PI/2 a mennyezet)
					// Ami Math.PI/4 (jobb), az 3*Math.PI/4 (bal) lesz
					return Math.PI - baseAngle;
				};

				if (layout === 'classic') {
					if (seg.type === 'turn') {
						const sectors = Math.max(1, Math.round(seg.angle / 30));
						const displaysPerSector = (seg.radius > 4.0) ? 3 : 2;
						const totalDisplays = sectors * displaysPerSector;

						for (let i = 0; i < totalDisplays; i++) {
							const t_turn = (i + 0.5) / totalDisplays;
							const d = currentDist + t_turn * segLen;
							const baseAngle = (i % 2 === 0) ? (Math.PI / 4) : (3 * Math.PI / 4);
							createLEDDisplayAt(d, getAngle(baseAngle), i, 0.335, colorOpt);
						}
					} 
					else if (seg.type === 'straight') {
						if (segLen <= 2.0) {
							const d1 = currentDist + 0.35;
							const d2 = currentDist + segLen - 0.35;
							// Mennyezet (Math.PI/2) tükrözve is mennyezet marad, de beletesszük a teljességért
							createLEDDisplayAt(d1, getAngle(Math.PI / 2), 0, 0.335, colorOpt);
							createLEDDisplayAt(d2, getAngle(Math.PI / 2), 1, 0.335, colorOpt);
						} else {
							const epsilon = 0.35; 
							const dLeft0 = currentDist + epsilon;
							const dLeft1 = currentDist + segLen * 0.5;
							const dLeft2 = currentDist + segLen - epsilon;

							createLEDDisplayAt(dLeft0, getAngle(Math.PI / 4), 0, 0.335, colorOpt);
							createLEDDisplayAt(dLeft1, getAngle(Math.PI / 4), 1, 0.335, colorOpt);
							createLEDDisplayAt(dLeft2, getAngle(Math.PI / 4), 2, 0.335, colorOpt);

							const dRight0 = (dLeft0 + dLeft1) / 2;
							const dRight1 = (dLeft1 + dLeft2) / 2;

							createLEDDisplayAt(dRight0, getAngle(3 * Math.PI / 4), 3, 0.335, colorOpt);
							createLEDDisplayAt(dRight1, getAngle(3 * Math.PI / 4), 4, 0.335, colorOpt);
						}
					}
				} else if (layout === 'front_r_back_l') {
					createLEDDisplayAt(currentDist + segLen * 0.25, getAngle(3 * Math.PI / 4), 0, 0.335, colorOpt);
					createLEDDisplayAt(currentDist + segLen * 0.75, getAngle(Math.PI / 4), 1, 0.335, colorOpt);
				} else if (layout === 'back_r_front_l') {
					createLEDDisplayAt(currentDist + segLen * 0.75, getAngle(3 * Math.PI / 4), 0, 0.335, colorOpt);
					createLEDDisplayAt(currentDist + segLen * 0.25, getAngle(Math.PI / 4), 1, 0.335, colorOpt);
				} else if (layout === 'ceiling_double') {
					createLEDDisplayAt(currentDist + segLen * 0.5, getAngle(Math.PI / 2), 0, 0.335 * 2, colorOpt);
				} else if (layout === 'scattered_upper') {
					const sizeLong = seg.ledSpacingLong !== undefined ? seg.ledSpacingLong : 1.0;
					const lanesCount = seg.ledSpacingAng !== undefined ? seg.ledSpacingAng : 3;
					const customRadius = (seg.ledSize !== undefined ? seg.ledSize : 0.3) / 2;

					const angStart = 0.0;
					const angEnd = Math.PI;

					let colIdx = 0;
					for (let d = currentDist + sizeLong / 2; d < segEnd; d += sizeLong) {
						for (let lane = 0; lane < lanesCount; lane++) {
							if (lanesCount > 1 && (colIdx + lane) % 2 === 1) continue;

							let baseAngle;
							if (lanesCount === 1) {
								baseAngle = Math.PI / 2;
							} else {
								baseAngle = angStart + (lane / (lanesCount - 1)) * (angEnd - angStart);
							}

							const dJitter = (Math.random() - 0.5) * sizeLong * 0.3;
							const finalD = Math.max(currentDist + customRadius, Math.min(segEnd - customRadius, d + dJitter));

							let angJitter = 0;
							if (lanesCount > 1) {
								const maxAngJitter = ((angEnd - angStart) / (lanesCount - 1)) * 0.3;
								angJitter = (Math.random() - 0.5) * maxAngJitter;
							} else {
								angJitter = (Math.random() - 0.5) * 0.3;
							}
							
							const finalAngle = Math.max(0, Math.min(Math.PI, baseAngle + angJitter));

							let finalColor = colorOpt;
							if (colorOpt === 'mixed') {
								const colors = ['#ff0000', '#00ff00', '#0000ff', '#ffff00'];
								finalColor = colors[(colIdx * lanesCount + lane) % colors.length];
							}

							// Itt is meghívjuk a tükrözést
							createLEDDisplayAt(finalD, getAngle(finalAngle), colIdx * lanesCount + lane, customRadius, finalColor);
						}
						colIdx++;
					}
				}
			}
			else if (seg.light === 'daylight_top_dots') {
				const lanes = seg.topDotLanes !== undefined ? seg.topDotLanes : 1;
				for (let d = currentDist + 0.4; d < segEnd; d += 0.8) {
					for (let i = 0; i < lanes; i++) {
						let ang = Math.PI / 2; // Ha 1 sáv van, pontosan a tetőn (90 fok) helyezkedik el
						if (lanes > 1) {
							// Páros vagy több sáv esetén szimmetrikusan osztja el a pontokat 45 és 135 fok között
							ang = Math.PI / 4 + (i / (lanes - 1)) * (Math.PI / 2);
						}
						const bentGeo = bendGeometryToSlide(daylightTopDotGeoBase, d, ang, 0.030);
						slideGroup.add(new THREE.Mesh(bentGeo, daylightMat));
					}
				}
			}
			else if (seg.light === 'jumpscare') {
				const triggerDist = currentDist + segLen / 2;
				const dotGeo = new THREE.CircleGeometry(0.02, 16);
				const dotMat = new THREE.MeshBasicMaterial({ color: 0xffffff, side: THREE.DoubleSide });
				
				
				[-2.4, 2.4].forEach(ang => {
					const p = getPointOnSlide(triggerDist, ang, 0.005);
					const dot = new THREE.Mesh(dotGeo, dotMat);
					dot.position.copy(p);
					
					
					const centerPos = getPointOnSlide(triggerDist, ang, window.SLIDE_RAD);
					dot.lookAt(centerPos);
					
					slideGroup.add(dot);
				});

				jumpscares.push({ dist: triggerDist, triggered: false });
			}
			else if (seg.light === 'blacklight' && seg.type === 'turn') {
				const R = window.SLIDE_RAD;
				const dCenter = currentDist + segLen / 2;
				
				// Külső (széles) ív és belső (szűk) ív szögei
				const outerAngle = seg.dir === 'left' ? 0 : Math.PI;
				const innerAngle = seg.dir === 'left' ? Math.PI : 0;

				// 1. Foszforeszkáló motívum (Teljes hosszt kitöltő vászon)
				const texUrl = seg.customTextureBase64 || "https://threejs.org/examples/textures/sprites/spark1.png";
				const motifTex = new THREE.TextureLoader().load(texUrl);
				
				// A kép a teljes rendelkezésre álló felületre ráhúzódik
				motifTex.wrapS = THREE.ClampToEdgeWrapping; 
				motifTex.wrapT = THREE.ClampToEdgeWrapping;

				const motifMat = new THREE.MeshBasicMaterial({
					map: motifTex, 
					color: 0xdd88ff, // Foszforeszkáló lila/pink árnyalat
					transparent: true, 
					blending: THREE.AdditiveBlending, 
					side: THREE.DoubleSide
				});

				// A vászon hossza megegyezik a kanyar hosszával (segLen), magassága R * 1.5
				// Nagyon sűrű rácsra bontjuk (pl. 64x16), hogy a hosszú kanyarokat is tökéletesen lekövesse
				const segmentsX = Math.max(16, Math.ceil(segLen * 4));
				const planeGeo = new THREE.PlaneGeometry(segLen, R * 1.5, segmentsX, 16); 
				
				// Rásimítjuk a falra (1.5 cm eltartás, hogy ne villogjon a fal textúrájával)
				const bentPlane = bendGeometryToSlide(planeGeo, dCenter, outerAngle, 0.015);
				slideGroup.add(new THREE.Mesh(bentPlane, motifMat));

				// 2. Fekete fényű (UV) lapos panelek a szűk (belső) íven
				const uvLampMat = new THREE.MeshBasicMaterial({ color: 0x5500ff }); 
				
				// Lapos téglalapok, amik rásimulnak a falra (1 méter hosszú, 10 cm széles)
				const lampLen = 1.0; 
				const lampWidth = 0.1; 
				
				// Kiszámítjuk, hány lámpa fér el szépen elosztva a kanyarban
				const numLamps = Math.max(2, Math.floor(segLen / 3)); 
				const lampSpacing = segLen / numLamps;

				for (let i = 0; i < numLamps; i++) {
					const dLamp = currentDist + (i + 0.5) * lampSpacing;

					// Sík geometria a lámpának, sűrűn vágva a hajlításhoz
					const lampGeo = new THREE.PlaneGeometry(lampLen, lampWidth, 8, 2);
					// Ezt is pontosan rásimítjuk a falra (0.015 offset), így egyáltalán nem áll ki!
					const bentLamp = bendGeometryToSlide(lampGeo, dLamp, innerAngle, 0.015);
					slideGroup.add(new THREE.Mesh(bentLamp, uvLampMat));

					// Valódi lila/UV fényt kibocsátó PointLight (ezt picit beljebb tesszük, hogy bevilágítsa a csövet)
					const lightPos = getPointOnSlide(dLamp, innerAngle, 0.1); 
					const uvLight = new THREE.PointLight(0x7700ff, 2.5, R * 2.5);
					uvLight.position.copy(lightPos);
					slideGroup.add(uvLight);
				}
			}
			else if (seg.light === 'water_curtain') {
				const d = currentDist + segLen / 2;
				const t = d / totalLen;
				const pos = mainPath.getPointAt(t);
				const T = mainPath.getTangentAt(t).normalize();

				const canvas = document.createElement('canvas');
				canvas.width = 512; canvas.height = 512;
				const ctx = canvas.getContext('2d');
				const texture = new THREE.CanvasTexture(canvas);

				const mat = new THREE.MeshBasicMaterial({ 
					map: texture, 
					transparent: true, 
					opacity: 0.80, 
					side: THREE.DoubleSide,
					depthWrite: true 
				});

				
				const curtainShape = new THREE.Shape();
				const steps = 40;
				const props = getSlideProps(d);
				const rCurtain = (props.diameter / 2) - 0.015; // egy picit kisebb a belső héjnál, hogy ne lógjon ki
				
				for (let i = 0; i <= steps; i++) {
					const ang = (i / steps) * Math.PI * 2;
					const p1 = getShapeXY(props.shape1, rCurtain, ang);
					const p2 = getShapeXY(props.shape2, rCurtain, ang);
					const lx = p1.x * (1 - props.t) + p2.x * props.t;
					const ly = p1.y * (1 - props.t) + p2.y * props.t;
					
					if (i === 0) curtainShape.moveTo(lx, ly);
					else curtainShape.lineTo(lx, ly);
				}
				const geo = new THREE.ShapeGeometry(curtainShape);
				const posAttr = geo.attributes.position;
				const uvAttr = geo.attributes.uv;
				
				// Megkeressük a legtávolabbi pontot a középponttól a torzulásmentes skálázáshoz
				let maxDist = 0;
				for (let i = 0; i < posAttr.count; i++) {
					const x = posAttr.getX(i);
					const y = posAttr.getY(i);
					const dist = Math.sqrt(x * x + y * y);
					if (dist > maxDist) maxDist = dist;
				}
				if (maxDist === 0) maxDist = 1;

				// UV koordináták felülírása: a (0,0) pont pontosan a (0.5, 0.5) textúra-középpontra esik
				for (let i = 0; i < posAttr.count; i++) {
					const x = posAttr.getX(i);
					const y = posAttr.getY(i);
					
					const u = (x / (2 * maxDist)) + 0.5;
					const v = (y / (2 * maxDist)) + 0.5;
					
					uvAttr.setXY(i, u, v);
				}
				uvAttr.needsUpdate = true;

				const mesh = new THREE.Mesh(geo, mat);
				
				mesh.position.copy(pos);
				mesh.lookAt(pos.clone().sub(T)); 
				
				const loadedImages = [];
				const img = new Image();
				img.crossOrigin = "Anonymous";
				// Ha van feltöltött kép (Base64), azt használja, különben az alapértelmezett képet
				img.src = seg.customTextureBase64 || "https://threejs.org/examples/textures/brick_diffuse.jpg";
				loadedImages.push(img);

				mesh.userData = { 
					canvas: canvas, ctx: ctx, texture: texture, 
					images: loadedImages,
					imgIdx: 0,
					lastSwitch: 0,
					waterY: 0,
					// ÚJ: Animáció dekódoló állapotainak előkészítése
					customCode: (() => {
						try {
							return seg.waterCustomCode ? JSON.parse(seg.waterCustomCode) : null;
						} catch (e) {
							console.warn("Érvénytelen projektor kód:", e);
							return null;
						}
					})(),
					customFrameIdx: 0,
					customLastUpdate: 0,
					customGridState: null
				};
				
				const tempCanvas = document.createElement('canvas');
				const tempCtx = tempCanvas.getContext('2d');

				mesh.userData = { 
					canvas: canvas, ctx: ctx, texture: texture, 
					images: loadedImages,
					imgIdx: 0,
					lastSwitch: 0,
					waterY: 0,
					customCode: (() => {
						try {
							return seg.waterCustomCode ? JSON.parse(seg.waterCustomCode) : null;
						} catch (e) {
							console.warn("Érvénytelen projektor kód:", e);
							return null;
						}
					})(),
					customFrameIdx: 0,
					customLastUpdate: 0,
					customGridState: null,
					tempCanvas: tempCanvas,
					tempCtx: tempCtx
				};

				waterCurtains.push(mesh);
				slideGroup.add(mesh);
				
				const R = props.diameter / 2;
				const extColor = seg.color || '#ffcc00';
				const extMat = new THREE.MeshPhongMaterial({ color: extColor, shininess: 40 });

				// 1. Szilárd vízfüggöny burkolat (cső tetejétől a keret tetejéig szilárd, pontos szélességgel)
				const archShape = new THREE.Shape();
				archShape.moveTo(-R, R + 0.3); // Bal felső sarok (pontosan a csúszda szélénél, 30 cm-rel a teteje felett)
				archShape.lineTo(R, R + 0.3);  // Jobb felső sarok
				archShape.lineTo(R, 0);        // Jobb szél a cső középvonalánál

				// Íves rész kirajzolása a cső külső palástja mentén (jobbról balra haladva)
				const arcSegments = 32;
				for (let i = 0; i <= arcSegments; i++) {
					const theta = (i / arcSegments) * Math.PI;
					const ax = R * Math.cos(theta);
					const ay = R * Math.sin(theta);
					archShape.lineTo(ax, ay);
				}
				archShape.lineTo(-R, R + 0.3); // Vissza a bal felső sarokba

				const extrudeSettings = { depth: 0.1, bevelEnabled: false };
				const archGeo = new THREE.ExtrudeGeometry(archShape, extrudeSettings);
				archGeo.translate(0, 0, -0.05); // Központosítás a Z-tengelyen (vastagság felezése)

				const archMesh = new THREE.Mesh(archGeo, extMat);
				archMesh.position.copy(pos);
				archMesh.lookAt(pos.clone().add(T));
				slideGroup.add(archMesh);

				// 2. Vetítő doboz (1 méterrel a vízfüggöny után)
				const dProj = d + 1.0;
				if (dProj <= totalLen) {
					const tProj = dProj / totalLen;
					const posProj = mainPath.getPointAt(tProj);
					const TProj = mainPath.getTangentAt(tProj).normalize();

					// 40 cm széles, 20 cm magas, 50 cm hosszú téglatest
					const projBox = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.2, 0.5), extMat);
					projBox.position.copy(posProj);
					projBox.lookAt(posProj.clone().add(TProj));
					
					// Felemelés a cső külső ívére, belógás nélkül
					projBox.translateY(R + 0.09); 
					slideGroup.add(projBox);
				}
			}
			else if (seg.light === 'daylight_dots') {
				for (let d = currentDist + 0.6; d < segEnd; d += 1.2) {
					let rowOffset = (Math.floor(d * 10) % 2 === 0) ? 0 : (Math.PI / 6);
					for (let i = 0; i < 6; i++) {
						const ang = (i / 6) * Math.PI * 2 + rowOffset;
						const bentGeo = bendGeometryToSlide(daylightDotGeoBase, d, ang, 0.030);
						slideGroup.add(new THREE.Mesh(bentGeo, daylightMat));
					}
				}
			}
			else if (seg.light === 'daylight_stars') {
				for (let d = currentDist + 0.8; d < segEnd; d += 1.6) {
					let rowOffset = (Math.floor(d * 10) % 2 === 0) ? 0 : (Math.PI / 5);
					for (let i = 0; i < 5; i++) {
						const ang = (i / 5) * Math.PI * 2 + rowOffset;
						const bentGeo = bendGeometryToSlide(daylightStarGeoBase, d, ang, 0.030);
						slideGroup.add(new THREE.Mesh(bentGeo, daylightMat));
					}
				}
			}
			else if (seg.light === 'daylight_rings') {
				// Sűrűbb teljes 3D-s fehér fénygyűrűk (1.0m helyett 0.4 méterenként)
				for (let d = currentDist + 0.2; d < segEnd; d += 0.4) {
					const ringPoints = [];
					for (let i = 0; i <= 40; i++) {
						const ang = (i / 40) * Math.PI * 2;
						ringPoints.push(getPointOnSlide(d, ang, 0.026));
					}
					const ringCurve = new THREE.CatmullRomCurve3(ringPoints);
					const ringGeo = new THREE.TubeGeometry(ringCurve, 40, 0.015, 8, true);
					slideGroup.add(new THREE.Mesh(ringGeo, daylightMat));
				}
			}
			else if (seg.light === 'daylight_half_rings') {
				// Sűrűbb 3D-s fehér félgyűrűk csak a csúszda felső felén (1.0m helyett 0.4 méterenként)
				for (let d = currentDist + 0.2; d < segEnd; d += 0.4) {
					const ringPoints = [];
					for (let i = 0; i <= 20; i++) {
						const ang = (i / 20) * Math.PI;
						ringPoints.push(getPointOnSlide(d, ang, 0.026));
					}
					const ringCurve = new THREE.CatmullRomCurve3(ringPoints);
					const ringGeo = new THREE.TubeGeometry(ringCurve, 20, 0.015, 8, false);
					slideGroup.add(new THREE.Mesh(ringGeo, daylightMat));
				}
			}
			else if (seg.light === 'tunnel_rings') {
				const R = window.SLIDE_RAD;
				
				// Megkeressük az ehhez a szakaszhoz tartozó dinamikus alagút-textúrát
				const td = tunnelDisplays.find(t => t.segmentIdx === segIdx);
				if (td) {
					const ringMat = new THREE.MeshBasicMaterial({ map: td.texture, side: THREE.DoubleSide });
					
					// Nyolcadkörönként (kb. 3.0 m) pontosan 8 db gyűrű távolsága: 3.0 / 8 = 0.375 m
					const spacing = 3.0 / 8; 
					
					for (let d = currentDist + spacing / 2; d < segEnd; d += spacing) {
						// MÓDOSÍTVA: 2 cm vastag (0.02 m), falba simuló körkörös LED sáv
						const ringGeo = new THREE.CylinderGeometry(R - 0.004, R - 0.004, 0.02, 64, 1, true);
						const ringMesh = new THREE.Mesh(ringGeo, ringMat);
						
						// Pozicionálás és orientáció a cső tangense mentén
						const t = d / totalLen;
						const fIdx = Math.min(Math.floor(t * (frames.normals.length - 1)), frames.normals.length - 1);
						ringMesh.position.copy(mainPath.getPointAt(t));
						ringMesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), frames.tangents[fIdx]);
						ringMesh.rotateX(Math.PI / 2);
						
						slideGroup.add(ringMesh);
					}
				}
			}
			if (seg.type === 'space_bowl') {
				const bowlD = parseFloat(seg.bowlDiameter) || 8.0;
				const rotations = parseFloat(seg.rotations) || 2.0;
				const slope = seg.slope !== undefined ? seg.slope : 0.055;
				const isLeft = (seg.dir === 'left');
				const isClosed = (seg.bowlStyle === 'closed');
				
				const R_tube = (seg.diameter || 2.0) / 2;
				const R_start = seg.computedRStart || ((bowlD / 2) - R_tube * 1.25);
				
				const center = seg.computedCenter || new THREE.Vector3();
				const startAngle = seg.computedStartAngle || 0;
				const spiralDrop = seg.computedSpiralDrop || 0;
				
				const bowlHeight = Math.max(2.0, spiralDrop); 
				const points = [];
				const floorSegs = 30;
				
				const R_hole = 0.0; 
				
				for (let i = 0; i <= floorSegs; i++) {
					const f = i / floorSegs;
					const r = f * (bowlD / 2);
					const h = Math.pow(f, 2) * bowlHeight;
					points.push(new THREE.Vector2(r, h));
				}
				
				if (isClosed) {
					const roofSegs = 15;
					for (let i = 1; i <= roofSegs; i++) {
						const f = i / roofSegs;
						const r = (bowlD/2) * (1 - f);
						const h = bowlHeight + Math.sin(f * Math.PI / 2) * 1.2;
						points.push(new THREE.Vector2(r, h));
					}
				} else {
					points.push(new THREE.Vector2(bowlD/2 + 0.08, bowlHeight));
					for (let i = floorSegs; i >= 0; i--) {
						const f = i / floorSegs;
						const r = f * (bowlD/2) + 0.08;
						const h = Math.pow(f, 2) * bowlHeight - 0.06;
						points.push(new THREE.Vector2(r, h));
					}
					points.push(new THREE.Vector2(0, -0.06));
				}
				
				const bowlGeo = new THREE.LatheGeometry(points, 128);
				
				// --- Kivágási logika ---
				const positionAttr = bowlGeo.attributes.position;
				const indexAttr = bowlGeo.index;
				const newIndices = [];

				// JAVÍTOTT: Dinamikus elforgatás a bemeneti szöghöz képest -22.5 fokkal eltolva
				const rotAngle = startAngle - Math.PI / 8;
				function rotateY(v, angle) {
					const cos = Math.cos(angle);
					const sin = Math.sin(angle);
					return new THREE.Vector3(
						v.x * cos + v.z * sin,
						v.y,
						-v.x * sin + v.z * cos
					);
				}

				// Analitikus bemeneti henger felépítése
				const T_ent = seg.computedStartTangent || new THREE.Vector3(0, 0, -1);
				const P_ent = (seg.computedStartPos || new THREE.Vector3()).clone().sub(center);
				
				const ent_B = P_ent.clone().add(T_ent.clone().multiplyScalar(0.02)); 
				const ent_A = P_ent.clone().sub(T_ent.clone().multiplyScalar(4.0)); 

				const rCut = R_tube * 1.15; 

				function distToSegment(v, a, b) {
					const ab = new THREE.Vector3().subVectors(b, a);
					const av = new THREE.Vector3().subVectors(v, a);
					let u = av.dot(ab) / ab.lengthSq();
					u = Math.max(0, Math.min(1, u));
					const c = a.clone().add(ab.multiplyScalar(u));
					return v.distanceTo(c);
				}

				// JAVÍTOTT: Dinamikus kivezető cső ív mintavételezés a tökéletes, átmérőhöz igazodó vágáshoz
				const nextSegPoints = [];
				const nextSegProps = [];
				const nextStartDist = currentDist + segLen;
				const nextSeg = PARAMS.segments[segIdx + 1];
				if (nextSeg) {
					const nextSegLen = (nextSeg.type === 'straight') ? (nextSeg.len || 0.1) : 
					                   ((parseFloat(nextSeg.radius) || 0.1) * (Math.abs(parseFloat(nextSeg.angle)) * Math.PI / 180));
					const numSamples = 30; 
					for (let s = 0; s <= numSamples; s++) {
						const sampleDist = nextStartDist + (s / numSamples) * nextSegLen;
						const pt = mainPath.getPointAt(Math.max(0, Math.min(1, sampleDist / totalLen)));
						nextSegPoints.push(pt);
						
						const props = getSlideProps(sampleDist);
						nextSegProps.push((props.diameter / 2) * 1.03); // 3% biztonsági ráhagyás a tiszta élekért
					}
				}

				for (let i = 0; i < indexAttr.count; i += 3) {
					const idx0 = indexAttr.getX(i);
					const idx1 = indexAttr.getY(i);
					const idx2 = indexAttr.getZ(i);

					const v0 = new THREE.Vector3(positionAttr.getX(idx0), positionAttr.getY(idx0), positionAttr.getZ(idx0));
					const v1 = new THREE.Vector3(positionAttr.getX(idx1), positionAttr.getY(idx1), positionAttr.getZ(idx1));
					const v2 = new THREE.Vector3(positionAttr.getX(idx2), positionAttr.getY(idx2), positionAttr.getZ(idx2));

					const v0_rot = rotateY(v0, rotAngle);
					const v1_rot = rotateY(v1, rotAngle);
					const v2_rot = rotateY(v2, rotAngle);

					const canCut0 = Math.sqrt(v0_rot.x * v0_rot.x + v0_rot.z * v0_rot.z) > (R_start - 0.2);
					const canCut1 = Math.sqrt(v1_rot.x * v1_rot.x + v1_rot.z * v1_rot.z) > (R_start - 0.2);
					const canCut2 = Math.sqrt(v2_rot.x * v2_rot.x + v2_rot.z * v2_rot.z) > (R_start - 0.2);

					const rCut0 = rCut * (1.0 + Math.max(0, Math.sqrt(v0_rot.x*v0_rot.x + v0_rot.z*v0_rot.z) - R_start) * 0.35);
					const rCut1 = rCut * (1.0 + Math.max(0, Math.sqrt(v1_rot.x*v1_rot.x + v1_rot.z*v1_rot.z) - R_start) * 0.35);
					const rCut2 = rCut * (1.0 + Math.max(0, Math.sqrt(v2_rot.x*v2_rot.x + v2_rot.z*v2_rot.z) - R_start) * 0.35);

					const inEnt = (canCut0 && distToSegment(v0_rot, ent_A, ent_B) < rCut0) || 
					              (canCut1 && distToSegment(v1_rot, ent_A, ent_B) < rCut1) || 
					              (canCut2 && distToSegment(v2_rot, ent_A, ent_B) < rCut2);

					// JAVÍTOTT: Dinamikus kivezető csővágás az elfolyó ág 3D-s íve alapján
					let inCenterHole = false;
					if (nextSegPoints.length > 0) {
						const v0_world = v0_rot.clone().add(center);
						const v1_world = v1_rot.clone().add(center);
						const v2_world = v2_rot.clone().add(center);
						
						let v0_in = false, v1_in = false, v2_in = false;
						for (let s = 0; s < nextSegPoints.length; s++) {
							const limit = nextSegProps[s];
							if (!v0_in && v0_world.distanceTo(nextSegPoints[s]) < limit) v0_in = true;
							if (!v1_in && v1_world.distanceTo(nextSegPoints[s]) < limit) v1_in = true;
							if (!v2_in && v2_world.distanceTo(nextSegPoints[s]) < limit) v2_in = true;
						}
						inCenterHole = v0_in || v1_in || v2_in;
					}

					if (!inEnt && !inCenterHole) {
						newIndices.push(idx0, idx1, idx2);
					}
				}

				bowlGeo.setIndex(newIndices);
				bowlGeo.computeVertexNormals();
				
				let bowlMat;
				const extColor = seg.color || '#ffcc00';
				
				if (isClosed && seg.customTextureBase64) {
					const tex = new THREE.TextureLoader().load(seg.customTextureBase64);
					tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
					tex.repeat.set(8, 4);
					bowlMat = new THREE.MeshBasicMaterial({ map: tex, side: THREE.DoubleSide });
					bowlMat.userData = { alwaysGlow: seg.alwaysGlow };
					customTextureMaterials.push(bowlMat);
				} else {
					bowlMat = new THREE.MeshPhongMaterial({ color: extColor, side: THREE.DoubleSide, shininess: 40 });
				}
				
				const bowlMesh = new THREE.Mesh(bowlGeo, bowlMat);
				bowlMesh.position.copy(center);
				bowlMesh.rotation.y = startAngle - Math.PI / 8; // A tálat is dinamikus bemeneti szögbe forgatjuk
				bowlMesh.castShadow = true; bowlMesh.receiveShadow = true;
				slideGroup.add(bowlMesh);

				// Kivezető cső lerövidítve 0.1 méterre a zuhanásmentes csatlakozáshoz
				const dropLen = 0.1; 
				const exitTubeGeo = new THREE.CylinderGeometry(R_tube, R_tube, dropLen, 32, 1, true);
				const exitMat = new THREE.MeshPhongMaterial({ 
					color: seg.color || '#ffcc00', 
					side: THREE.DoubleSide, 
					shininess: 40 
				});
				const exitMesh = new THREE.Mesh(exitTubeGeo, exitMat);
				exitMesh.position.set(center.x, center.y - dropLen / 2, center.z);
				exitMesh.castShadow = true; exitMesh.receiveShadow = true;
				segmentGroups[segIdx].add(exitMesh); // MÓDOSÍTVA
			}

			// SZEKTORONKÉNTI HÁTTÉR LÉTREHOZÁSA ÉS HOZZÁADÁSA A SZEKTORHOZ
			if (bgPositions.length > 0) {
				const bgGeom = new THREE.BufferGeometry();
				bgGeom.setAttribute('position', new THREE.Float32BufferAttribute(bgPositions, 3));
				bgGeom.setIndex(bgIndices);
				bgGeom.computeVertexNormals();
				segmentGroups[segIdx].add(new THREE.Mesh(bgGeom, orangeMat));
			}

			currentDist = segEnd;
			slideGroup.add = _origAdd; // Visszaállítjuk az eredeti funkciót
		}); // <--- ITT ÉR VÉGET A CIKLUS
	}
	
	function setAllLEDs(state) {
		for (let r = 0; r < allRings.length; r++) {
			const ring = allRings[r];
			// Ha a gyűrű szektora rejtve van a kamerától, a CPU átugorja a frissítését!
			if (ring && ring[0] && ring[0].parent && ring[0].parent.visible) {
				const len = ring.length;
				for (let l = 0; l < len; l++) {
					if (ring[l]) {
						ring[l].visible = state;
					}
				}
			}
		}
	}
	
	const ledSteps = {
        
        1: [

					state.pIdx = 0;
					state.sIdx = (state.sIdx + 1) % progList.length;
				}
				stepNum = progList[state.sIdx % progList.length];
				stepPhases = ledSteps[stepNum];
				pDef = stepPhases[state.pIdx % stepPhases.length];
			}
			let cp = (state.time % pDef.timePerCycle) / pDef.timePerCycle;
			return { pDef, cp };
		}

		// 1. FÜGGETLEN VÍZSZINTES ANIMÁCIÓ FRISSÍTÉSE (Új szaggatott gyűrűknek)
		const hSub = advanceSubState(horizontalState, horizontalPrograms, delta);
		try { hSub.pDef.update(hSub.cp); } catch (e) {}

		const brokenStates = {};
		for (let r = 0; r < allRings.length; r++) {
			const ring = allRings[r];
			if (ring && ring[0] && ring[0].userData && ring[0].userData.type === 'broken_ring') {
				const states = [];
				for (let l = 0; l < 32; l++) {
					const st = ring[l] ? ring[l].visible : false;
					states[l] = st;
					states[l + 32] = st;
					states[l + 64] = st;
				}
				brokenStates[r] = states;
			}
		}

		// 2. FÜGGETLEN KÖRBEMENŐS ANIMÁCIÓ FRISSÍTÉSE (Spiráloknak)
		const rSub = advanceSubState(rotationalState, rotationalPrograms, delta);
		try { rSub.pDef.update(rSub.cp); } catch (e) {}

		const spiralStates = {};
		for (let r = 0; r < allRings.length; r++) {
			const ring = allRings[r];
			if (ring && ring[0] && ring[0].userData && ring[0].userData.type === 'spiral') {
				const states = [];
				for (let l = 0; l < 32; l++) {
					const st = ring[l] ? ring[l].visible : false;
					states[l] = st;
					states[l + 32] = st;
					states[l + 64] = st;
				}
				spiralStates[r] = states;
			}
		}

		// 3. FŐ ANIMÁCIÓS LÁNC FRISSÍTÉSE (Kisebb átmérőjű, régi logikájú gyűrűknek)
		const stepNum = sections[animState.sIdx][animState.stepInSIdx];
		const phaseDef = ledSteps[stepNum][animState.pIdx];
		
		animState.time += delta;
		const totalDur = phaseDef.cycles * phaseDef.timePerCycle;
		const cp = (animState.time % phaseDef.timePerCycle) / phaseDef.timePerCycle;

		try { phaseDef.update(cp); } catch (e) {}

		if (animState.time >= totalDur) { 
			animState.time = 0;
			animState.pIdx++;
			if (animState.pIdx >= ledSteps[stepNum].length) { 
				animState.pIdx = 0;
				animState.stepInSIdx++;
				if (animState.stepInSIdx >= sections[animState.sIdx].length) { 
					animState.stepInSIdx = 0;
					if (isRandomOrder) {
						let nextIdx;
						do { 
							nextIdx = Math.floor(Math.random() * sections.length);
						} while (nextIdx === animState.sIdx && sections.length > 1);
						animState.sIdx = nextIdx;
					} else {
						animState.sIdx = (animState.sIdx + 1) % sections.length;
					}
					animState.paused = true;
				}
			}
		}

		// 4. ÁLLAPOTOK EGYESÍTÉSE A MEGFELELŐ CSŐSZAKASZOKRA
		for (let r = 0; r < allRings.length; r++) {
			const ring = allRings[r];
			if (!ring || ring.length === 0) continue;
			if (ring[0] && ring[0].parent && !ring[0].parent.visible) continue;
			const type = ring[0].userData ? ring[0].userData.type : null;

			if (type === 'broken_ring' && brokenStates[r]) {
				for (let l = 0; l < ring.length; l++) {
					if (ring[l]) ring[l].visible = brokenStates[r][l];
				}
			} else if (type === 'spiral' && spiralStates[r]) {
				for (let l = 0; l < ring.length; l++) {

			} else if (type === 'star_ring_64') {

				for (let l = 0; l < 32; l++) {

					}
				}
			} else if (ring.length === 96) {
				for (let l = 0; l < 32; l++) {
					if (ring[l]) {
						const st = ring[l].visible;
						if (ring[l + 32]) ring[l + 32].visible = st;
						if (ring[l + 64]) ring[l + 64].visible = st;
					}
				}
			}
		}
	}

    
    let progress = 0;

	function animate() {

            const lookAheadDist = 2.0; 
            const lookAheadT = Math.min(t + (lookAheadDist / totalLen), 1.0);

                    let mu;        // Csúszási súrlódási együttható (Friction)

                    if (posture === 'sit') {
                        mu = 0.040;        // Nagy felület ér a csőhöz

                    } else {

                    // 2. Gravitációs gyorsulás a lejtő irányába
                    const gravityAcc = -9.81 * Math.sin(pitchAngle);
                    
                    // 3. Normálerő (súlypont) miatti alapsúrlódás

                    // ÚJ: Ha a kanyar hozzányom a falhoz (magas G), a súrlódás drasztikusan megnő!
                    frictionAcc += (latGForce * 9.81) * (mu * 1.5);

                    const dragAcc = dragCoeff * simulatedSpeed * simulatedSpeed;

                    }

                    if (simulatedSpeed <= 0.1 && acc < 0) {

                    // 8. Sebesség frissítése

                    // --- TELEMETRIA KIÍRÁSA A KÉPERNYŐRE ---
                    document.getElementById('telemetrySpd').innerText = simulatedSpeed.toFixed(2) + " m/s";
                    document.getElementById('telemetryTilt').innerText = (Math.abs(pitchAngle * 180 / Math.PI)).toFixed(1) + "°";
                    document.getElementById('telemetryG').innerText = latGForce.toFixed(2) + " G";

                } else {
                    // Kézi sebesség
                    simulatedSpeed = parseFloat(document.getElementById('moveSpeed').value) || 2.0;
                    document.getElementById('telemetrySpd').innerText = simulatedSpeed.toFixed(2) + " m/s";
                    document.getElementById('telemetryTilt').innerText = "KÉZI";
                    document.getElementById('telemetryG').innerText = "-";
                }
                
                // Stopper óra elindítása
                if (progress === 0 && simulatedSpeed > 0) {
                    slideTime = 0;
                    timerRunning = true;
                }

                // Haladás a pályán a kiszámolt sebességgel
                progress += (simulatedSpeed * delta) / totalLen;

                if (timerRunning) {
                    slideTime += delta;
                    let totalMs = Math.floor(slideTime * 1000);
                    let ms = Math.floor((totalMs % 1000) / 10);
                    let sec = Math.floor((totalMs / 1000) % 60);
                    let min = Math.floor(totalMs / 60000);
                    if(timerDisplay) timerDisplay.innerText = 
                        (min < 10 ? "0" + min : min) + ":" + 
                        (sec < 10 ? "0" + sec : sec) + "." + 
                        (ms < 10 ? "0" + ms : ms);

                if (progress >= 1) {

            // --- KAMERA DŐLÉS (BANKING) A CENTRIFUGÁLIS ERŐTŐL ---

            const worldUp = new THREE.Vector3(0, 1, 0);
            worldUp.applyAxisAngle(tangent, rollAngle);

            let side = new THREE.Vector3().crossVectors(tangent, worldUp).normalize();
            if (side.lengthSq() < 0.0001) {

                side = new THREE.Vector3().crossVectors(tangent, altUp).normalize();

            const up = new THREE.Vector3().crossVectors(side, tangent).normalize();

            // --- 1. JELENLEGI KAMERAPOZÍCIÓ MAGASSÁGA ---
            let propsNow = getSlideProps(t * totalLen);
            let currentRadius = propsNow.diameter / 2;
            
            let p1_bottom = getShapeXY(propsNow.shape1, currentRadius, -Math.PI / 2, propsNow.lanes1);
            let p2_bottom = getShapeXY(propsNow.shape2, currentRadius, -Math.PI / 2, propsNow.lanes2);
            let floorYOffset = p1_bottom.y * (1 - propsNow.t) + p2_bottom.y * propsNow.t;
            
            // Kamera 70 cm magasan van az aljzattól
            const heightFromCenter = (propsNow.shape2 === 'lazy') ? (-currentRadius + 0.70) : (floorYOffset + 0.70);

            let curLanes = (propsNow.shape2 === 'multi') ? (propsNow.lanes2 || 1) : 1; 
            let selectedLaneEl = document.getElementById('selectedLane');
            let selLane = selectedLaneEl ? Math.min(Math.max(1, parseInt(selectedLaneEl.value) || 1), curLanes) : 1;
            
            let laneOffset = 0;
            if (curLanes > 1) {
                let u = ((selLane - 1) + 0.5) / curLanes; 
                laneOffset = (u - 0.5) * currentRadius * 2;
            }

            const cameraPos = pos.clone()
                .add(up.clone().multiplyScalar(heightFromCenter))

            // --- 2. CÉLPONT (LOOK-AT) ---
            const targetSide = new THREE.Vector3().crossVectors(targetTangent, worldUp).normalize();
            const targetUp = new THREE.Vector3().crossVectors(targetSide, targetTangent).normalize();
            
            let propsTarget = getSlideProps(lookAheadT * totalLen);
            let targetRadius = propsTarget.diameter / 2;

            let p1_targetBottom = getShapeXY(propsTarget.shape1, targetRadius, -Math.PI / 2, propsTarget.lanes1);
            let p2_targetBottom = getShapeXY(propsTarget.shape2, targetRadius, -Math.PI / 2, propsTarget.lanes2);
            let targetFloorYOffset = p1_targetBottom.y * (1 - propsTarget.t) + p2_targetBottom.y * propsTarget.t;

            const targetHeightFromCenter = (propsTarget.shape2 === 'lazy') ? (-targetRadius + 0.70) : (targetFloorYOffset + 0.70);

            let targetLanes = (propsTarget.shape2 === 'multi') ? (propsTarget.lanes2 || 1) : 1;
            let selLaneTarget = selectedLaneEl ? Math.min(Math.max(1, parseInt(selectedLaneEl.value) || 1), targetLanes) : 1;
            
            let laneOffsetTarget = 0;
            if (targetLanes > 1) {
                let uT = ((selLaneTarget - 1) + 0.5) / targetLanes;
                laneOffsetTarget = (uT - 0.5) * targetRadius * 2;

            const lookAtPos = targetPos
                .add(targetUp.clone().multiplyScalar(targetHeightFromCenter))
                .add(targetSide.clone().multiplyScalar(laneOffsetTarget));
                
            camera.lookAt(lookAtPos);

            // =======================================================
            // LÁTÓTÉR VÁGÁS (FRUSTUM CULLING) - Közvetlenül a lookAt után!
            // =======================================================
             if (!isExternal) {
            // Belső nézet: Okos látószög-vágás a lagmentes csúszásért
            const frustum = new THREE.Frustum();

            const camPos = camera.position;

        } else {

            for (let i = 0; i < segmentGroups.length; i++) {
                segmentGroups[i].visible = true;
            }
        }        
        }

		
		starPoints.forEach(s => {

		whiteDotsGroup.visible = Math.floor(time * 10) % 2 === 0;

		const drawLEDLine = (ctx, dotCanvas, x1, y1, x2, y2) => {

		// === KEREK LED KIJELZŐK LOGIKÁJA ===
		activeSharedLeds.forEach(disp => {

			const coilStep = Math.floor((time + id * 0.05) / (isSlowMode ? 0.4 : 0.1));
