<!DOCTYPE html>
<html lang="hu">
<head>

        button.rem-btn { background: #dc3545; color: white; border: none; padding: 2px 5px; float: right; cursor: pointer; }
        .segment-card { background: #1a1a1a; padding: 10px; margin-bottom: 8px; border-left: 3px solid #0088ff; }
</style>
<body>
		<div id="timerDisplay" style="position: absolute; top: 20px; left: 50%; transform: translateX(-50%); z-index: 10; font-size: 32px; font-weight: bold; color: #ffcc00; font-family: monospace; text-shadow: 2px 2px 4px #000; background: rgba(0,0,0,0.5); padding: 5px 15px; border-radius: 8px;">

		<div class="param-group" style="border-top: 1px solid #444; padding-top: 10px; margin-top: 10px;">

        <div id="segments-container"></div>

			<div style="display:flex; justify-content:space-between;">

			</div>
			<div style="display:flex; justify-content:space-between;">

		<button class="add-btn" style="background: linear-gradient(135deg, #00b0ff, #00e676); color:#000; font-weight:bold; margin-top:5px;" onclick="jumpToEarthEnd()" data-tr="procJumpEnd">
			UGRÁS A CSÚSZDA VÉGÉRE (50 méterrel a kifutó elé)
		</button>
		<label style="color:#00ff88; font-weight:bold;" data-tr="algTitle">ALGORITMIKUS HOSSZABBÍTÁS</label>
		<div style="display:flex; gap:5px; margin-bottom:5px;">
			<select id="extendPosition" style="flex:1; background:#222; color:#fff; border:1px solid #555;">
				<option value="end" data-tr="toEnd">Pálya végére</option>
				<option value="start" data-tr="toStart">Pálya elejére</option>
			</select>
			<input type="number" id="extendCount" value="3" min="1" max="10" style="width:50px; text-align:center; background:#222; color:#fff; border:1px solid #555;">
		</div>
		<button class="add-btn" style="background:#00ff88; color:#000; font-weight:bold; margin-top:5px;" onclick="algorithmicExtend()" data-tr="genExt">KITERJESZTÉS GENERÁLÁSA</button>
	</div>
<script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
    }
</script>
<script type="module">
	class SlideAudioEngine {
		constructor() {
			this.ctx = null;
			this.isPlaying = false;
			this.masterGain = null;
			this.waterNoise = null;
			this.waterFilter = null;
			this.waterGain = null;
			this.splashFilter = null;
			this.splashGain = null;
			this.polyphonyLimit = 8;
			this.voices = [];
			this.audioEl = null;
			this.audioSource = null;
			this.audioAnalyser = null;
			this.audioGain = null;
			this.freqData = null;
			this.isCustomAudioLoaded = false;
			this.musicBus = { energy: 0.5, bass: 0.5, mids: 0.5, highs: 0.5, beat: 0.5, isMusicActive: false };
			const buildStampedSong = (notes) => {
				let st = 0;
				return notes.map(n => {
					const obj = { f: n.f, d: n.d, start: st, v: n.v || 0.85 };
					st += n.d;
					return obj;
				});
			};
			this.songs = [
				buildStampedSong([
					{ f: 261.63, d: 0.27, v: 0.9 }, { f: 329.63, d: 0.27, v: 0.9 }, { f: 392.00, d: 0.27, v: 0.9 },
					{ f: 261.63, d: 0.27, v: 0.9 }, { f: 329.63, d: 0.27, v: 0.9 }, { f: 392.00, d: 0.27, v: 0.9 },
					{ f: 261.63, d: 0.27, v: 0.9 }, { f: 349.23, d: 0.27, v: 0.9 }, { f: 440.00, d: 0.27, v: 0.9 },
					{ f: 261.63, d: 0.27, v: 0.9 }, { f: 349.23, d: 0.27, v: 0.9 }, { f: 440.00, d: 0.27, v: 0.9 },
					{ f: 293.66, d: 0.27, v: 0.9 }, { f: 392.00, d: 0.27, v: 0.9 }, { f: 493.88, d: 0.27, v: 0.9 },
					{ f: 293.66, d: 0.27, v: 0.9 }, { f: 392.00, d: 0.27, v: 0.9 }, { f: 493.88, d: 0.27, v: 0.9 },
					{ f: 261.63, d: 0.27, v: 0.9 }, { f: 329.63, d: 0.27, v: 0.9 }, { f: 392.00, d: 0.27, v: 0.9 },
					{ f: 523.25, d: 0.81, v: 1.0 }
				]),
				buildStampedSong([
					{ f: 233.08, d: 0.27, v: 0.85 }, { f: 311.13, d: 0.27, v: 0.85 }, { f: 233.08, d: 0.27, v: 0.85 }, { f: 392.00, d: 0.27, v: 0.85 },
					{ f: 233.08, d: 0.27, v: 0.85 }, { f: 311.13, d: 0.54, v: 0.90 }, { f: 0, d: 0.27 },
					{ f: 233.08, d: 0.27, v: 0.85 }, { f: 311.13, d: 0.27, v: 0.85 }, { f: 233.08, d: 0.27, v: 0.85 }, { f: 392.00, d: 0.27, v: 0.85 },
					{ f: 233.08, d: 0.27, v: 0.85 }, { f: 311.13, d: 0.54, v: 0.90 }
				])
			];
			this.songIdx = 0;
			this.songTime = 0;
		}
		init() {
			if (this.ctx) return;
			this.ctx = new (window.AudioContext || window.webkitAudioContext)();
			this.masterGain = this.ctx.createGain();
			this.masterGain.gain.value = 1.2;
			this.masterGain.connect(this.ctx.destination);
			const bufferSize = this.ctx.sampleRate * 2;
			const noiseBuffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
			const output = noiseBuffer.getChannelData(0);
			let lastOut = 0.0;
			for (let i = 0; i < bufferSize; i++) {
				const white = Math.random() * 2 - 1;
				output[i] = (lastOut + (0.03 * white)) / 1.02;
				lastOut = output[i];
			}
			this.waterNoise = this.ctx.createBufferSource();
			this.waterNoise.buffer = noiseBuffer;
			this.waterNoise.loop = true;
			this.waterFilter = this.ctx.createBiquadFilter();
			this.waterFilter.type = 'bandpass';
			this.waterFilter.Q.value = 1.8;
			this.waterGain = this.ctx.createGain();
			this.waterGain.gain.value = 0.2;
			this.splashFilter = this.ctx.createBiquadFilter();
			this.splashFilter.type = 'highpass';
			this.splashFilter.frequency.value = 900;
			this.splashGain = this.ctx.createGain();
			this.splashGain.gain.value = 0.1;
			this.voices = [];
			for (let i = 0; i < this.polyphonyLimit; i++) {
				const osc = this.ctx.createOscillator();
				const filter = this.ctx.createBiquadFilter();
				const gain = this.ctx.createGain();
				osc.type = (i % 2 === 0) ? 'sawtooth' : 'triangle';
				filter.type = 'lowpass';
				filter.frequency.value = 3000;
				gain.gain.value = 0.0;
				osc.connect(filter);
				filter.connect(gain);
				gain.connect(this.masterGain);
				osc.start();
				this.voices.push({ osc: osc, filter: filter, gain: gain });
			}
			this.waterNoise.connect(this.waterFilter);
			this.waterFilter.connect(this.waterGain);
			this.waterGain.connect(this.masterGain);
			this.waterNoise.connect(this.splashFilter);
			this.splashFilter.connect(this.splashGain);
			this.splashGain.connect(this.masterGain);
			this.waterNoise.start();
			this.isPlaying = true;
		}
		loadAudioElement(src) {
			if (!this.ctx) this.init();
			if (this.audioEl) { this.audioEl.pause(); this.audioEl.src = ""; }
			this.audioEl = new Audio(src);
			this.audioEl.loop = true;
			this.audioEl.crossOrigin = "anonymous";
			if (!this.audioSource) {
				this.audioSource = this.ctx.createMediaElementSource(this.audioEl);
				this.audioAnalyser = this.ctx.createAnalyser();
				this.audioAnalyser.fftSize = 512;
				this.freqData = new Uint8Array(this.audioAnalyser.frequencyBinCount);
				this.audioGain = this.ctx.createGain();
				this.audioGain.gain.value = 0.8;
				this.audioSource.connect(this.audioAnalyser);
				this.audioAnalyser.connect(this.audioGain);
				this.audioGain.connect(this.masterGain);
			}
			this.audioEl.play().catch(e => console.log("Audio play allowed"));
			this.isCustomAudioLoaded = true;
		}
		update(speed, gForce, diameter, isOpen, lightType, rawDelta, isPaused, proximity) {
			if (!this.ctx) return;
			const now = this.ctx.currentTime;
			if (this.ctx.state === 'suspended' && window.isAudioEnabled) {
				this.ctx.resume();
			}
			if (!window.isAudioEnabled) {
				this.isPlaying = false;
				this.musicBus.isMusicActive = false;
				for (let i = 0; i < this.polyphonyLimit; i++) {
					this.voices[i].gain.gain.setTargetAtTime(0.0, now, 0.02);
				}
				if (this.waterGain) this.waterGain.gain.setTargetAtTime(0.0, now, 0.02);
				if (this.splashGain) this.splashGain.gain.setTargetAtTime(0.0, now, 0.02);
				if (this.audioGain) this.audioGain.gain.setTargetAtTime(0.0, now, 0.02);
				return;
			}
			this.isPlaying = true;
			this.musicBus.isMusicActive = true;
			const currentSpeed = Math.max(0.1, speed || 0.1);
			const currentG = Math.max(0, gForce || 0);
			const speedRatio = Math.min(3.0, currentSpeed / 6.0);
			const targetWaterFreq = 250 + (speedRatio * 2200) + (currentG * 600);
			const targetWaterGain = Math.min(0.90, 0.08 + (speedRatio * 0.40) + (currentG * 0.20));
			this.waterFilter.frequency.setTargetAtTime(targetWaterFreq, now, 0.04);
			this.waterGain.gain.setTargetAtTime(isPaused ? 0.0 : targetWaterGain, now, 0.04);
			const splashVal = (currentG > 0.05) ? Math.min(0.75, currentG * 0.40) : 0.0;
			this.splashFilter.frequency.setTargetAtTime(1200 + speedRatio * 1500, now, 0.04);
			this.splashGain.gain.setTargetAtTime(isPaused ? 0.0 : splashVal, now, 0.04);
			if (this.isCustomAudioLoaded && this.audioAnalyser) {
				this.audioAnalyser.getByteFrequencyData(this.freqData);
				let sumBass = 0, sumMids = 0, sumHighs = 0;
				for (let i = 0; i < 15; i++) sumBass += this.freqData[i];
				for (let i = 15; i < 80; i++) sumMids += this.freqData[i];
				for (let i = 80; i < 200; i++) sumHighs += this.freqData[i];
				this.musicBus.bass = Math.min(1.0, (sumBass / 15 / 255.0) * 1.8);
				this.musicBus.mids = Math.min(1.0, (sumMids / 65 / 255.0) * 1.8);
				this.musicBus.highs = Math.min(1.0, (sumHighs / 120 / 255.0) * 1.8);
				this.musicBus.energy = (this.musicBus.bass + this.musicBus.mids + this.musicBus.highs) / 3.0;
				this.musicBus.beat = Math.pow(this.musicBus.bass, 1.4);
				if (this.audioGain) {
					this.audioGain.gain.setTargetAtTime(isPaused ? 0.0 : Math.min(1.0, 0.6 + speedRatio * 0.2), now, 0.05);
				}
			} else {
				const currentSong = this.songs[this.songIdx % this.songs.length];
				this.songTime += rawDelta;
				const songTotalDuration = currentSong.length > 0 ? (currentSong[currentSong.length - 1].start + currentSong[currentSong.length - 1].d) : 5.0;
				if (this.songTime >= songTotalDuration) {
					this.songTime = 0;
					this.songIdx++;
				}
				const currentTime = this.songTime;
				const activeNotes = currentSong.filter(n => n.f > 0 && currentTime >= n.start && currentTime < (n.start + n.d));
				if (activeNotes.length > 0) {
					let maxVel = 0, avgFreq = 0;
					for (let i = 0; i < activeNotes.length; i++) {
						maxVel = Math.max(maxVel, activeNotes[i].v || 0.85);
						avgFreq += activeNotes[i].f;
					}
					avgFreq /= activeNotes.length;
					const activeNote = activeNotes[0];
					const noteElapsed = Math.max(0, currentTime - activeNote.start);
					const noteProgress = Math.min(1.0, noteElapsed / Math.max(0.05, activeNote.d));
					this.musicBus.bass = avgFreq < 350 ? maxVel : maxVel * 0.3;
					this.musicBus.mids = (avgFreq >= 350 && avgFreq < 700) ? maxVel : maxVel * 0.3;
					this.musicBus.highs = avgFreq >= 700 ? maxVel : maxVel * 0.3;
					this.musicBus.energy = maxVel;

	function bendGeometryToSlide(baseGeo, d, baseAngle, offsetDist) {

		const R_actual = isLazy ? 3.0 : nominalR;
		const r = R_actual - offsetDist;
		for (let i = 0; i < posAttr.count; i++) {
			const lx = posAttr.getX(i);
			const ly = posAttr.getY(i);
			const angle = baseAngle - (ly / R_actual);

			let p2 = getShapeXY(props.shape2, r, angle, props.lanes2, nominalR);

	window.updateSeg = function(i, prop, val) {
        PARAMS.segments[i][prop] = val;
		const straightOnlyLights = ['center_tris', 'water_curtain', 'text'];
		const turnOnlyLights = ['turn_circles', 'turn_droplets', 'blacklight'];
		if (prop === 'type') {
			if (val === 'turn') {
				PARAMS.segments[i].radius = 4; 
				PARAMS.segments[i].angle = 90; 
				PARAMS.segments[i].dir = 'left'; 
				if (straightOnlyLights.includes(PARAMS.segments[i].light)) {
					PARAMS.segments[i].light = 'rings';
				}
			} else if (val === 'straight') {
				if (turnOnlyLights.includes(PARAMS.segments[i].light)) {
					PARAMS.segments[i].light = 'rings';
				}
			}
		}
		if (prop === 'diameter' && val < 1.4 && PARAMS.segments[i].light === 'star_rings') {
			PARAMS.segments[i].light = 'rings';
		}
        if (prop === 'type' && val === 'space_bowl') {
            if (!PARAMS.segments[i].bowlDiameter) PARAMS.segments[i].bowlDiameter = 8.0;
            if (!PARAMS.segments[i].bowlStyle) PARAMS.segments[i].bowlStyle = 'open';
            if (!PARAMS.segments[i].rotations) PARAMS.segments[i].rotations = 2.0;
            if (!PARAMS.segments[i].exitDrop) PARAMS.segments[i].exitDrop = 2.5;
            if (!PARAMS.segments[i].dir) PARAMS.segments[i].dir = 'left';
        }
        if (prop === 'shape' && val === 'multi' && !PARAMS.segments[i].lanes) {
            PARAMS.segments[i].lanes = 3;
        }
        if (!PARAMS.segments[i].light) PARAMS.segments[i].light = 'rings';
        renderUI();
    };

		const runoutColor = document.getElementById('runoutColor') ? document.getElementById('runoutColor').value : '#0088ff';
		const rMat = new THREE.MeshPhongMaterial({ color: runoutColor, side: THREE.DoubleSide });

		const shapeType = lastProps.shape2;
		const edgeCoord = getShapeXY(shapeType, R, -Math.PI);

		const thickness = 0.1;

		const ctx = canvas.getContext('2d');

		ctx.strokeStyle = '#555555'; ctx.lineWidth = 4;

			ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, 256); ctx.stroke();

	function createSlidePath() {
		const path = new THREE.CurvePath();
		let currP = new THREE.Vector3(0, 0, 0);
		let currYaw = -Math.PI / 2; 
		let totalS = 0;
        let currY = 0; 
		PARAMS.segments.forEach(seg => {
            const slope = seg.slope !== undefined ? seg.slope : 0.055;
			if (seg.type === 'straight') {
				const length = seg.len || 0.1;
				const nextP = new THREE.Vector3(currP.x + Math.cos(currYaw) * length, 0, currP.z + Math.sin(currYaw) * length);
                const nextY = currY - length * slope;
				const p1 = currP.clone(); const p2 = nextP.clone();
				p1.y = currY; p2.y = nextY;
				path.add(new THREE.LineCurve3(p1, p2));
				currP.copy(nextP);
                currY = nextY;
				totalS += length;
			} 
			else if (seg.type === 'turn') {
				const radius = parseFloat(seg.radius) || 0.1;
				const angleDeg = parseFloat(seg.angle) || 0;
				const angleRad = (angleDeg * Math.PI) / 180;
				if (angleDeg === 0) return;
				const isLeft = (seg.dir === 'left');
				const sweep = isLeft ? -angleRad : angleRad;
				const centerAngle = currYaw + (isLeft ? -Math.PI/2 : Math.PI/2);
				const center = new THREE.Vector3(currP.x + Math.cos(centerAngle) * radius, 0, currP.z + Math.sin(centerAngle) * radius);
				const startAngle = Math.atan2(currP.z - center.z, currP.x - center.x);
                const curveLen = radius * angleRad;
                const nextY = currY - curveLen * slope;
				const steps = Math.ceil(angleDeg / 5) + 5;
				for (let i = 0; i < steps; i++) {
					const a1 = startAngle + (i / steps) * sweep;
					const a2 = startAngle + ((i + 1) / steps) * sweep;
                    const p1Y = currY + (nextY - currY) * (i / steps);
                    const p2Y = currY + (nextY - currY) * ((i + 1) / steps);
					const p1 = new THREE.Vector3(center.x + Math.cos(a1) * radius, p1Y, center.z + Math.sin(a1) * radius);
					const p2 = new THREE.Vector3(center.x + Math.cos(a2) * radius, p2Y, center.z + Math.sin(a2) * radius);
					path.add(new THREE.LineCurve3(p1, p2));
				}
				currYaw += sweep;
				const finalPoint = path.curves[path.curves.length - 1].v2;
				currP.set(finalPoint.x, 0, finalPoint.z);
                currY = nextY;
				totalS += curveLen;
			}
			else if (seg.type === 'space_bowl') {
				const bowlD = parseFloat(seg.bowlDiameter) || 8.0;
				const rotations = parseFloat(seg.rotations) || 2.0;
				const slope = seg.slope !== undefined ? seg.slope : 0.055;
				const isLeft = (seg.dir === 'left');
				const R_tube = (seg.diameter || 2.0) / 2;
				const R_start = (bowlD / 2) - R_tube * 1.1; 
				const R_exit = 0.0; 
				const centerAngle = currYaw + (isLeft ? -Math.PI/2 : Math.PI/2);
				const avgR = (R_start + R_exit) / 2;
				const sweep = (isLeft ? -1 : 1) * Math.PI * 1 * rotations;
				const spiralLen = avgR * Math.abs(sweep);
				const spiralDrop = Math.max(R_tube + 0.5, spiralLen * slope);
				const center = new THREE.Vector3(
					currP.x + Math.cos(centerAngle) * R_start, 
					currY - spiralDrop, 
					currP.z + Math.sin(centerAngle) * R_start
				);
				const startAngle = Math.atan2(currP.z - center.z, currP.x - center.x);
				seg.computedCenter = center.clone();
				seg.computedStartAngle = startAngle;
				seg.computedSpiralDrop = spiralDrop;
				seg.computedRStart = R_start;
				seg.computedStartPos = new THREE.Vector3(currP.x, currY, currP.z);
				seg.computedStartTangent = new THREE.Vector3(Math.cos(currYaw), -slope, Math.sin(currYaw)).normalize();
				const spiralSteps = 100;
				let lastSpiralPoint = currP.clone();
				lastSpiralPoint.y = currY;
				const bowlHeight = Math.max(2.0, spiralDrop); 
				for (let i = 1; i <= spiralSteps; i++) {
					const f = i / spiralSteps;
					const a = startAngle + f * sweep;
					const r = R_start * (1 - f) + R_exit * f;
					const pY = currY * (1 - f) + (center.y) * f;
					const p = new THREE.Vector3(
						center.x + Math.cos(a) * r,
						pY,
						center.z + Math.sin(a) * r
					);
					path.add(new THREE.LineCurve3(lastSpiralPoint.clone(), p.clone()));
					lastSpiralPoint.copy(p);
				}
				const dropLen = 0.1; 
				const dropEndP = lastSpiralPoint.clone();
				dropEndP.y -= dropLen;
				path.add(new THREE.LineCurve3(lastSpiralPoint.clone(), dropEndP.clone()));
				currP.copy(dropEndP);
				currP.y = 0; 
				currY = dropEndP.y;
				const lastSpiralYaw = startAngle + sweep + (isLeft ? -Math.PI/2 : Math.PI/2);
				currYaw = lastSpiralYaw;
				seg.computedExitTangent = new THREE.Vector3(0, -1, 0); 
			}
		});
		return path;
	}
	function buildCustomTube(targetIdx = -1) {
		let currentDist = 0;
		let lastTunnelSeed = null;
		PARAMS.segments.forEach((seg, segIdx) => {
			const segLen = (seg.type === 'straight') ? (seg.len || 0.1) : 
						   (seg.type === 'space_bowl') ? (
							   (() => {
								   const bowlD = parseFloat(seg.bowlDiameter) || 8.0;
								   const rotations = parseFloat(seg.rotations) || 2.0;
								   const R_tube = (seg.diameter || 2.0) / 2;
								   const R_start = (bowlD / 2) - R_tube * 1.25; 
								   const avgR = R_start / 2;
								   const sweep = Math.PI * 1 * rotations;
								   const spiralLen = avgR * sweep;
								   const dropLen = 0.1;
								   return spiralLen + dropLen;
							   })()
						   ) :
						   ((parseFloat(seg.radius) || 0.1) * (Math.abs(parseFloat(seg.angle)) * Math.PI / 180));
			const segEnd = currentDist + segLen;
			if (targetIdx !== -1 && segIdx !== targetIdx) {
				currentDist = segEnd;
				return;
			}
			if (!segmentGroups[segIdx]) {
				const grp = new THREE.Group();
				grp.userData.lights = { starPoints: [], star2Points: [], starRingLeds: [], floorLights: [], centerTriangles: [], turnLeds: [], zigzagLeds: [] };
				segmentGroups[segIdx] = grp;
				slideGroup.add(grp);
			}
			if (seg.type === 'space_bowl') {
				currentDist = segEnd;
				lastTunnelSeed = null; 
				return;
			}
			const radSegs = isMoonSlideActive ? 48 : 120;
			const steps = Math.max(6, Math.floor(segLen * (isMoonSlideActive ? 8 : 15)));
			const vertsOut = [], vertsIn = [], indicesOut = [], indicesIn = [], colorsOut = [], colorsIn = [], uvsIn = [], uvsOut = [];
			const cColor = new THREE.Color(seg.color || '#ffcc00');
			for (let i = 0; i <= steps; i++) {
				const t_seg = i / steps;
				const dist = currentDist + t_seg * segLen;
				const clampedDist = Math.max(0, Math.min(totalLen, dist));
				const pos = getPointAtDistance(clampedDist);

				const props = getSlideProps(clampedDist, segIdx);
				const isLazy = (props.shape1 === 'lazy' || props.shape2 === 'lazy');
				const nominalR = props.diameter / 2;
				const R_actual = isLazy ? 3.0 : nominalR;
				const rOut = R_actual;
				const rIn = R_actual - 0.015;
				const colPrev = new THREE.Color(props.prevInner);
				const colCurr = new THREE.Color(props.currInner);
				const tempInColor = colPrev.clone().lerp(colCurr, props.t);
				const intensity = props.prevInt * (1 - props.t) + props.currInt * props.t;
				tempInColor.multiplyScalar(Math.min(1.0, Math.max(0.0, intensity)));
				for (let j = 0; j <= radSegs; j++) {
					const a = (j / radSegs) * Math.PI * 2;
					const u = t_seg;
					const v = j / radSegs;
					uvsIn.push(u, v);
					uvsOut.push(u, v);
					let p1Out = getShapeXY(props.shape1, rOut, a, props.lanes1, nominalR);
					let p2Out = getShapeXY(props.shape2, rOut, a, props.lanes2, nominalR);
